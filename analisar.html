<script>
/* ============================================================
   🔐 BLOQUEIO DE ACESSO
============================================================ */
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

/* ============================================================
   📌 LISTA DE VÉRTEBRAS VÁLIDAS (AUTO-SUGESTÃO)
============================================================ */
const vertebrasValidas = [
    "C1","C2","C3","C4","C5","C6","C7",
    "T1","T2","T3","T4","T5","T6","T7","T8","T9","T10","T11","T12",
    "L1","L2","L3","L4","L5",
    "S1","S2"
];

let niveis = [];
const lista = document.getElementById("lista");
const terminal = document.getElementById("terminal");
const inputV = document.getElementById("vertebra");
const inputA = document.getElementById("angulo");

/* ============================================================
   ✍ AUTO-SUGESTÃO EM TEMPO REAL
============================================================ */
inputV.addEventListener("input", () => {
    const texto = inputV.value.toUpperCase().trim();
    const sugestoes = vertebrasValidas.filter(v => v.startsWith(texto));
    if(sugestoes.length > 0){
        lista.textContent = "Sugestões: " + sugestoes.join(", ");
    }
});

/* ============================================================
   🚨 VALIDAÇÃO CLÍNICA DO ÂNGULO
============================================================ */
inputA.addEventListener("input", () => {
    const a = Number(inputA.value);
    if(a >= 30) terminal.textContent = "⚠ Ângulo grave – alto risco";
    else if(a >= 20) terminal.textContent = "⚠ moderado – monitorar";
    else terminal.textContent = "Ângulo dentro do fluxo clínico";
});

/* ============================================================
   ➕ ADICIONAR NÍVEL
============================================================ */
document.getElementById("addNivel").onclick = () => {
    const v = inputV.value.toUpperCase().trim();
    const a = Number(inputA.value);

    if(!vertebrasValidas.includes(v)){
        terminal.textContent = "❌ Vért. inválida – exemplo correto: T7 / L3 / C5";
        return;
    }
    if(!a && a !== 0){
        terminal.textContent = "❌ Ângulo inválido";
        return;
    }

    niveis.push({ vertebra:v, angle:a });
    lista.textContent = JSON.stringify(niveis, null, 2);
    inputV.value = ""; inputA.value = "";
};

/* ============================================================
   🚑 ENVIAR PARA A API (MÚLTIPLO)
============================================================ */
document.getElementById("enviar").onclick = async () => {
    if(niveis.length === 0){
        terminal.textContent = "⚠ Nenhum nível para enviar";
        return;
    }

    terminal.textContent = "🔄 Enviando análise...";

    try{
        const res = await fetch("https://revitarium.onrender.com/workflow/analyze/v4?patient_id=123", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(niveis)
        });

        const data = await res.json();
        terminal.textContent = JSON.stringify(data, null, 2);

    }catch(err){
        terminal.textContent = "❌ Erro ao conectar com a API.";
    }
};

/* ============================================================
   📄 PDF
============================================================ */
document.getElementById("btnPDF").onclick = async () => {
    const id = prompt("📄 ID do paciente?");
    if(!id) return;
    window.open(`https://revitarium.onrender.com/workflow/patient/${id}/report/pdf`, "_blank");
};

/* ============================================================
   ↩ VOLTAR
============================================================ */
document.getElementById("voltar").onclick = () => {
    window.location.href = "dashboard.html";
};
</script>
