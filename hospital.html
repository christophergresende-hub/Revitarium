<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium - Painel Hospitalar</title>

<style>
    body {
        margin: 0;
        background: #f3f8ff;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        color: #003366;
    }
    header {
        background: #0057A3;
        color: white;
        padding: 18px;
        text-align: center;
        font-weight: 600;
        font-size: 1.4rem;
        letter-spacing: 0.5px;
    }
    .container {
        padding: 20px;
    }
    h2 {
        color: #003366;
        margin-bottom: 10px;
        font-size: 1.2rem;
    }
    input, button {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        margin: 6px 0;
        border: 1px solid #cdd9e5;
        font-size: 1rem;
    }
    input {
        background: white;
        color: #003366;
    }
    .btn-primary {
        background: #007bff;
        color: white;
        border: none;
        font-weight: bold;
    }
    .btn-secondary {
        background: #e9eef6;
        color: #003366;
        border: none;
    }
    .btn-danger {
        background: #8B0000;
        color: white;
        border: none;
        font-weight: bold;
    }
    .section-title {
        font-weight: bold;
        margin-top: 25px;
        font-size: 1.1rem;
        color: #002a52;
    }
    /* Terminal retorno */
    .terminal {
        background: #ffffff;
        color: #002a52;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid #cdd9e5;
        margin-top: 15px;
        min-height: 120px;
        font-family: monospace;
        white-space: pre-wrap;
        font-size: 0.9rem;
    }

</style>
</head>

<body>

<header>Revitarium – Painel Hospitalar</header>

<div class="container">

    <h2>Inserir nível anatômico</h2>
    <input type="text" id="vertebra" placeholder="Ex: T7">
    <input type="number" id="angulo" placeholder="Ex: 12°">
    <button class="btn-primary" id="btnEnviar">Enviar para Análise</button>

    <h2 class="section-title">Acessos Clínicos</h2>
    <button class="btn-secondary" onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
    <button class="btn-secondary" onclick="window.location.href='evolucao.html'">📈 Evolução Longitudinal</button>
    <button class="btn-secondary" onclick="window.location.href='previsao.html'">🔮 Previsão Clínica</button>
    <button class="btn-danger" onclick="logout()">⛔ Encerrar Sessão</button>

    <h2 class="section-title">Retorno da API</h2>
    <div id="terminal" class="terminal">Aguardando dados...</div>

</div>

<script>
// Bloqueio sem login
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

// Envio para análise (API)
document.getElementById("btnEnviar").onclick = async () => {
    const vertebra = document.getElementById("vertebra").value.trim();
    const angulo = document.getElementById("angulo").value.trim();
    const terminal = document.getElementById("terminal");

    if(!vertebra || !angulo){
        terminal.textContent = "⚠️ Informe vértebra e ângulo.";
        return;
    }

    terminal.textContent = "🔄 Enviando...";

    try {
        const response = await fetch(
            "https://revitarium.onrender.com/workflow/analyze/v4?patient_id=123",
            {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify([{ vertebra, angle: Number(angulo) }])
            }
        );

        const data = await response.json();
        terminal.textContent = JSON.stringify(data, null, 2);
    }
    catch {
        terminal.textContent = "❌ Erro: não foi possível conectar à API.";
    }
};

// Logout
function logout(){
    localStorage.removeItem("revitarium_logged");
    window.location.href = "index.html";
}
</script>

</body>
</html>
