<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Clínico • Revitarium</title>

<style>
:root {
    --verde-base:#6EC4B3;
    --verde-escuro:#151e26;
    --branco:#ffffff;
}

body{
    margin:0;
    font-family:"Helvetica Neue",Arial,sans-serif;
    background:var(--branco);
}

/* Cabeçalho */
.header{
    background:var(--verde-base);
    padding:25px;
    text-align:center;
    font-size:1.5rem;
    font-weight:bold;
    color:white;
    letter-spacing:0.08em;
}

/* Container principal */
.container{
    padding:20px;
    max-width:600px;
    margin:auto;
}

input{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #9fd6c8;
    background:white;
    margin-bottom:12px;
    font-size:1rem;
}

/* Botão principal */
button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:var(--verde-escuro);
    color:white;
    font-size:1.1rem;
    font-weight:bold;
    margin-top:10px;
}

/* Terminal */
.terminal{
    background:#F4FFFC;
    border-left:6px solid var(--verde-base);
    padding:15px;
    margin-top:20px;
    border-radius:10px;
    min-height:120px;
    font-family:monospace;
    white-space:pre-wrap;
}

/* Menu inferior */
.menu-bottom{
    position:fixed;
    bottom:0; left:0; width:100%;
    background:var(--verde-escuro);
    padding:12px 0;
    display:flex; justify-content:space-around;
}
.menu-bottom button{
    background:none; border:none; color:white;
    font-size:1rem; font-weight:600;
}
</style>
</head>
<body>

<div class="header">📄 PDF Clínico</div>

<div class="container">
    <h3 style="color:var(--verde-escuro)">Gerar Documento do Paciente</h3>

    <input id="patientId" placeholder="ID do Paciente (ex: 123)">
    <button id="gerarPDF">📥 Baixar PDF Clínico</button>

    <pre id="terminal" class="terminal">Aguardando ação...</pre>
</div>

<div class="menu-bottom">
    <button onclick="nav('dashboard.html')">🏠 Início</button>
    <button onclick="nav('evolucao.html')">📈 Evolução</button>
    <button onclick="nav('previsao.html')">🔮 Previsão</button>
</div>

<script>
// Proteção por login
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href="index.html";
}

function nav(p){ window.location.href=p }

document.getElementById("gerarPDF").onclick = async () => {
    const id = document.getElementById("patientId").value.trim();
    const term = document.getElementById("terminal");

    if(!id){
        term.textContent = "Digite o ID do paciente.";
        return;
    }

    try{
        term.textContent = "Gerando PDF...";

        const pdfUrl = `https://revitarium.onrender.com/workflow/patient/${id}/report/pdf`;

        // Abre download do PDF
        window.open(pdfUrl, "_blank");
        term.textContent = "PDF gerado com sucesso. (aguarde o download)";
    }
    catch(err){
        term.textContent = "Erro ao gerar PDF.";
    }
};
</script>

</body>
</html>
