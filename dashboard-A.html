<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard A • Revitarium</title>

<style>
    body {
        background:#0a0f14;
        color:white;
        font-family:Arial, sans-serif;
        margin:0;
        padding:20px;
    }
    h1 { font-size:26px; font-weight:bold; margin-bottom:5px; }
    p { opacity:0.8; margin-bottom:20px; }
    input {
        width:100%;
        padding:14px;
        border-radius:10px;
        border:none;
        margin-bottom:12px;
        background:#111;
        color:white;
        font-size:16px;
    }
    button {
        width:100%;
        padding:16px;
        border:none;
        border-radius:10px;
        background:#0094FF;
        color:white;
        font-size:18px;
        margin:6px 0;
        font-weight:bold;
    }
    pre {
        background:black;
        padding:15px;
        border-radius:10px;
        white-space:pre-wrap;
        margin-top:15px;
        font-size:14px;
        border:1px solid #0f222f;
    }
</style>

</head>
<body>

<h1>Revitarium • Dashboard A</h1>
<p>Versão rápida para testes (mobile first)</p>

<input id="pid" placeholder="ID do Paciente (ex: 123)" />

<button onclick="viewDashboard()">Ver Dashboard</button>

<pre id="response">Aguardando...</pre>

<script>
function viewDashboard(){
    const id = document.getElementById("pid").value;

    if(!id){
        document.getElementById("response").innerText = "Informe um ID primeiro.";
        return;
    }

    fetch(`https://revitarium.onrender.com/workflow/patient/${id}/dashboard`)
    .then(r => r.json())
    .then(data => {
        document.getElementById("response").innerText = JSON.stringify(data, null, 2);
    })
    .catch(err => {
        document.getElementById("response").innerText = "Erro ao consultar API: " + err;
    });
}
</script>

</body>
</html>
