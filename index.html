<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium Login v8</title>
<style>
body{background:#0a0a0a;color:white;font-family:Arial;margin:0;padding:0}
.container{margin:0 auto;margin-top:120px;width:90%;max-width:380px;text-align:center}
input,button,select{width:100%;padding:14px;margin:8px 0;border:none;border-radius:8px;font-size:1rem}
input,select{background:#111;color:white}
button{background:#007bff;color:white;font-weight:bold}
</style>
</head>
<body>

<div class="container">
<h2>Login Revitarium</h2>

<select id="perfil">
<option value="clinico">Clínico / Profissional</option>
<option value="paciente">Paciente</option>
</select>

<input id="email" placeholder="Email ou ID" />
<input type="password" id="senha" placeholder="Senha" />
<button id="loginBtn">Entrar</button>
<div id="msg"></div>
</div>

<script>
document.getElementById("loginBtn").onclick = () => {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value.trim();
    const perfil = document.getElementById("perfil").value;

    // Contas de teste
    const users = {
        "clinico": { email:"123", senha:"123" },
        "paciente":{ email:"pac", senha:"123" }
    };

    if(email === users[perfil].email && senha === users[perfil].senha){
        localStorage.setItem("revitarium_logged","yes");
        localStorage.setItem("revitarium_role",perfil);
        localStorage.setItem("revitarium_user",email);
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("msg").textContent = "Acesso negado.";
    }
};
</script>

</body>
</html>
