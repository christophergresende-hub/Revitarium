<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium Login</title>

<style>
body {
    margin: 0; padding: 0;
    background: #eef1f5;
    font-family: Arial, sans-serif;
    display: flex; justify-content: center; align-items: center;
    height: 100vh;
}
.container {
    width: 90%; max-width: 380px;
    background: white; padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.15);
    text-align: center;
}
input, button {
    width: 100%; padding: 14px; margin-top: 10px;
    border-radius: 8px; border: 1px solid #ccc;
    font-size: 16px;
}
button {
    background: #0066ff; color: white; border: none; font-weight: bold;
}
button:hover {
    background: #004bb7;
}
#msg {
    margin-top: 15px; font-weight: bold;
}
</style>
</head>

<body>
<div class="container">
    <h2>Revitarium • Login</h2>
    <input type="email" id="email" placeholder="email">
    <input type="password" id="senha" placeholder="senha">
    <button onclick="login()">Entrar</button>
    <div id="msg"></div>
</div>

<script>
// CREDENCIAIS OFICIAIS
const USER = "admin@revitarium.ai";
const PASS = "revitarium123";

function login() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value.trim();
    const msg = document.getElementById("msg");

    if (email === USER && senha === PASS) {
        msg.style.color = "green";
        msg.textContent = "Acesso permitido. Redirecionando...";
        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 700);
    } else {
        msg.style.color = "red";
        msg.textContent = "Acesso negado | Verifique email e senha.";
    }
}
</script>
</body>
</html>
