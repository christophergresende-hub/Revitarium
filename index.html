<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium • Login</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: #0b0b0b;
        color: #fff;
        font-family: Arial, sans-serif;
    }
    .container {
        max-width: 450px;
        margin: 60px auto;
        padding: 20px;
        text-align: center;
    }
    h1 {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 30px;
    }
    input {
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }
    button {
        width: 100%;
        padding: 14px;
        margin-top: 15px;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
        font-size: 18px;
        font-weight: bold;
    }
    button:hover {
        background: #0066d6;
        cursor: pointer;
    }
    .msg {
        margin-top: 20px;
        font-size: 16px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Revitarium • Login</h1>

    <input id="email" type="text" placeholder="Email (use: 123)">
    <input id="senha" type="password" placeholder="Senha (use: 123)">
    <button onclick="login()">Entrar</button>

    <div id="msg" class="msg"></div>
</div>

<script>
function login() {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value.trim();
    const msg = document.getElementById("msg");

    if (email === "123" && senha === "123") {
        msg.style.color = "lightgreen";
        msg.innerText = "Acesso permitido. Redirecionando...";
        setTimeout(() => {
            window.location.href = "dashboard.html"; 
        }, 1000);
    } else {
        msg.style.color = "red";
        msg.innerText = "Acesso negado. Dados incorretos.";
    }
}
</script>

</body>
</html>
