<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviTARIUM V14 - Clinical Biomechanics Intelligence</title>

<style>
body{
  margin:0;
  background:url('fundo-estrelas.jpg') no-repeat center/cover;
  font-family:Arial, sans-serif;
  color:#b7faff;
  overflow:hidden;
}

/* CONTAINER PRINCIPAL */
#container {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
}

/* TÍTULO */
#titulo{
  position:absolute;
  top:60px; left:50%; transform:translateX(-50%);
  text-align:center;
}
#titulo h1{ margin:10px 0; font-size:42px; font-weight:300; letter-spacing:1px; }
#titulo h2{ font-size:18px; font-weight:300; }

/* BOX PRINCIPAL */
#painel{
  position:absolute;
  top:200px; left:50%; transform:translateX(-50%);
  width:80%; max-width:950px;
  border-radius:32px;
  border:1px solid rgba(150,255,255,0.25);
  padding:40px;
  backdrop-filter: blur(6px);
}

/* CAMPOS */
label{ font-size:20px; }
input{
  width:100%;
  background:rgba(160,255,255,0.05);
  border:1px solid rgba(160,255,255,0.35);
  border-radius:12px;
  padding:16px;
  font-size:18px;
  color:#c7ffff;
  margin:10px 0 26px 0;
}

/* ÍCONES À ESQUERDA */
.area-icones{
  display:grid;
  grid-template-columns:repeat(2, 120px);
  grid-gap:18px;
  position:absolute;
  left:60px; top:260px;
}
.icone{
  width:120px; height:120px;
  border-radius:18px;
  background:rgba(0,255,255,0.08);
  backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center;
  transition:0.25s;
  cursor:pointer;
}
.icone:hover{
  filter:drop-shadow(0 0 10px #2ffcff);
}

/* MULHER */
.mulher{
  position:absolute;
  height:820px;
  right:120px;
  top:200px;
  pointer-events:none;
  user-select:none;
}

/* MENU INFERIOR */
.menu{
  width:100%;
  position:absolute;
  bottom:40px; left:50%; transform:translateX(-50%);
  display:flex; justify-content:center; gap:60px;
}
.menu a{
  font-size:22px;
  color:#c5ffff;
  text-decoration:none;
  transition:.25s;
}
.menu a:hover{
  filter:drop-shadow(0 0 8px #2fffed);
}
</style>
</head>

<body>

<div id="container">

  <!-- TÍTULO -->
  <div id="titulo">
    <img src="logo-revitarium.png" style="height:90px;">
    <h1>ReviTARIUM <strong>V14</strong></h1>
    <h2>Clinical Biomechanics Intelligence</h2>
  </div>

  <!-- PAINEL -->
  <div id="painel">

    <label>ID do Paciente</label>
    <input type="text" placeholder="Ex: 123">

    <label>Inserir Nível Vertebral</label>
    <input type="text" placeholder="Ex: T7 - 12°">

  </div>

  <!-- ÍCONES -->
  <div class="area-icones">
    <div class="icone"><img src="icon-skull.png" height="70"></div>
    <div class="icone"><img src="icon-cervical.png" height="70"></div>
    <div class="icone"><img src="icon-thoracic.png" height="70"></div>
    <div class="icone"><img src="icon-ribcage.png" height="70"></div>
    <div class="icone"><img src="icon-pelvis.png" height="70"></div>
    <div class="icone"><img src="icon-limbs.png" height="70"></div>
    <div class="icone"><img src="icon-fullbody.png" height="70"></div>
  </div>

  <!-- MULHER -->
  <img src="mulher-neon-tech.png" class="mulher">

  <!-- MENU -->
  <div class="menu">
    <a href="#">Início</a>
    <a href="#">Evolução</a>
    <a href="#">Previsão</a>
  </div>

</div>

</body>
</html>
