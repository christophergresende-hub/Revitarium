<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ReviTARIUM v14</title>
<link rel="stylesheet" href="style-dashboard.css">

<style>
body {
  margin:0;
  background: url("assets/fundo.webp") no-repeat center/cover fixed;
  font-family: Arial, sans-serif;
  color:white;
}
.container {
  width: 90%;
  margin:auto;
  margin-top: 40px;
  border:1px solid rgba(255,255,255,0.2);
  border-radius:20px;
  padding:20px;
  backdrop-filter: blur(6px);
  background: rgba(0,255,255,0.05);
}
.input {
  width:100%; padding:12px;
  background:rgba(255,255,255,0.1);
  border-radius:10px; border:none;
  color:white; margin-bottom:15px;
}
.icons-grid {
  display:grid; grid-template-columns:repeat(3, 1fr);
  gap:12px; margin-top: 20px;
}
.icons-grid img {
  width:95px; height:95px; border-radius:20px;
  background:rgba(0,255,255,0.1);
  padding:10px; border:1px solid rgba(0,255,255,0.2);
}
.mulher {
  position:absolute;
  right:6%;
  top:26%;
  width:260px;
}
.footer-nav {
  position:fixed; bottom:0; left:0; width:100%;
  display:flex; justify-content:space-around;
  background:rgba(0,255,255,0.08); padding:15px;
  backdrop-filter:blur(8px);
}
</style>
</head>
<body>

<div class="container">
  <h1>ReviTARIUM v14</h1>
  <p>Clinical Biomechanics Intelligence</p>

  <input class="input" placeholder="ID do Paciente  Ex:123">
  <input class="input" placeholder="Inserir Nível Vertebral Ex: T7 • 12°">

  <div class="icons-grid">
    <img src="assets/ico-cranio.png">
    <img src="assets/ico-coluna1.png">
    <img src="assets/ico-coluna2.png">
    <img src="assets/ico-torax.png">
    <img src="assets/ico-bacia.png">
    <img src="assets/ico-perna.png">
    <img src="assets/ico-full.png">
  </div>
</div>

<img class="mulher" src="assets/mulher.webp">

<div class="footer-nav">
  <span>🏠 Início</span><span>📈 Evolução</span><span>🔮 Previsão</span>
</div>

</body>
</html>
