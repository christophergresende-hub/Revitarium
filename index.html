<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Revitarium • Login (v13 iOS)</title>
<style>
    body {
        margin:0; font-family:-apple-system, BlinkMacSystemFont, Arial;
        background:#0A0A0A; color:white;
        display:flex; justify-content:center; align-items:center;
        height:100vh; padding:20px;
    }
    .card{
        width:100%; max-width:390px;
        background:#111; padding:30px; border-radius:20px;
        box-shadow:0 0 25px rgba(0,0,0,.6);
        animation:fade .4s ease;
    }
    @keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    h1{font-size:1.7rem;text-align:center;margin-bottom:20px;}
    input,button{
        width:100%;padding:15px;margin:10px 0;border-radius:12px;
        border:none;font-size:1rem;
    }
    input{background:#222;color:white;}
    button{
        background:#008CFF;color:white;font-weight:bold;
        box-shadow:0 4px 10px rgba(0,140,255,.4);
    }
    .footer{text-align:center;margin-top:15px;font-size:.8rem;color:#999;}
</style>
</head>
<body>

<div class="card">
<h1>Revitarium</h1>

<input id="email" type="text" placeholder="Email: 123"/>
<input id="senha" type="password" placeholder="Senha: 123"/>

<button id="loginBtn">Entrar</button>
<div class="footer">v13 • iOS Clinical Interface</div>
</div>

<script>
document.getElementById("loginBtn").onclick = () => {
    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value.trim();
    
    if(email === "123" && senha === "123"){
        localStorage.setItem("revitarium_logged","yes");
        window.location.href = "dashboard.html";
    } else {
        alert("Credenciais inválidas");
    }
};
</script>

</body>
</html>
