<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revitarium Login</title>
<style>
body {
  background: #0A0F1F;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin:0; color:white;
}
.container {
  background: #111827;
  padding: 30px;
  border-radius: 12px;
  width: 90%;
  max-width: 360px;
}
input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 6px;
  border: none;
}
button {
  width: 100%;
  padding: 12px;
  background: #06B6D4;
  border: none;
  border-radius: 6px;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
  <h2>Revitarium Login</h2>
  <input id="user" type="text" placeholder="Usuário">
  <input id="pass" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
  <p id="msg"></p>
</div>

<script>
function login(){
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  if(u === "admin" && p === "123"){
    localStorage.setItem("logged", "true");
    window.location.href = "revitarium-dashboard.html"; // redireciona
  } else {
    document.getElementById("msg").innerText = "Acesso negado";
  }
}
</script>

</body>
</html>
