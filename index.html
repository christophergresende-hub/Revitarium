<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revitarium | Login</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0a0f24;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .login-container {
        background: #11172e;
        padding: 30px;
        border-radius: 12px;
        width: 90%;
        max-width: 380px;
        box-shadow: 0 0 20px rgba(0,0,0,0.6);
        text-align: center;
    }
    h2 {
        margin-bottom: 20px;
        font-size: 22px;
        letter-spacing: 1px;
    }
    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: none;
        outline: none;
        background: #0c1325;
        color: white;
        font-size: 15px;
    }
    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: #3b82f6;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        color: white;
        transition: 0.2s;
    }
    button:hover {
        background: #2563eb;
    }
    .error {
        color: #ff4e4e;
        margin-top: 10px;
        font-size: 14px;
    }
</style>
</head>
<body>

<div class="login-container">
    <h2>Revitarium – Login</h2>
    
    <form id="loginForm">
        <input type="text" id="username" placeholder="Usuário" autocomplete="off" required />
        <input type="password" id="password" placeholder="Senha" required />
        <button type="submit">Entrar</button>
    </form>

    <p class="error" id="errorMsg"></p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    // Credenciais atuais (mock)
    if(user === "admin" && pass === "admin"){
        window.location.href = "revitarium-dashboard.html";
    } 
    else {
        document.getElementById("errorMsg").innerText = "Acesso negado. Usuário ou senha incorretos.";
    }
});
</script>

</body>
</html>
