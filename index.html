<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revitarium • Dashboard</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0e0e0e;
        color: #fff;
    }
    .container {
        max-width: 440px;
        margin: auto;
        padding: 20px;
    }
    input, button {
        width: 100%;
        padding: 15px;
        margin: 10px 0;
        border-radius: 10px;
        border: none;
        font-size: 16px;
    }
    input {
        background: #1f1f1f;
        color: white;
    }
    button {
        background: #007bff;
        color: white;
        font-weight: bold;
    }
    button:hover {
        opacity: 0.85;
    }
    /* MOBILE-FIRST */
    @media (max-width: 480px) {
        body { font-size: 15px; }
        button { padding: 14px; font-size: 15px; }
        input { padding: 14px; }
    }
</style>
</head>

<body>
<div class="container">
    <h1>Revitarium – Dashboard</h1>
    <p>Login</p>

    <input id="email" type="email" placeholder="email" />
    <input id="senha" type="password" placeholder="senha" />
    <button onclick="login()">Entrar</button>

    <hr style="margin:30px 0; border:0.5px solid #333">

    <h2>Paciente</h2>
    <input id="pid" type="text" placeholder="ID do Paciente (ex: 123)">
    <button onclick="verDashboard()">Ver Dashboard</button>
    <button onclick="evolucao()">Evolução Longitudinal</button>
    <button onclick="previsao()">Previsão Clínica</button>

    <pre id="saida" style="background:black; color:lime; padding:15px; border-radius:10px; height:200px; overflow:auto;">Aguardando...</pre>
</div>

<script>
// login simples temporário
function login() {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    if(email === "admin@revitarium.ai" && senha === "revitarium123") {
        alert("Login OK");
        localStorage.setItem("auth", "ok");
    } else {
        alert("Acesso negado");
    }
}

function verDashboard(){
    if(!localStorage.getItem("auth")) return alert("Faça login primeiro.");
    const id = document.getElementById("pid").value;
    fetch(`https://revitarium.onrender.com/workflow/analyze/v4?patient_id=${id}`)
        .then(r => r.json()).then(data => {
            document.getElementById("saida").textContent = JSON.stringify(data, null, 2);
        });
}

function evolucao(){
    const id = document.getElementById("pid").value;
    fetch(`https://revitarium.onrender.com/workflow/patient/${id}/evolution`)
        .then(r => r.json()).then(data => {
            document.getElementById("saida").textContent = JSON.stringify(data, null, 2);
        });
}

function previsao(){
    const id = document.getElementById("pid").value;
    fetch(`https://revitarium.onrender.com/workflow/patient/${id}/predict`)
        .then(r => r.json()).then(data => {
            document.getElementById("saida").textContent = JSON.stringify(data, null, 2);
        });
}
</script>
</body>
</html>
