<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviTARIUM v14</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

body{
    background:url("assets/fundo.webp") no-repeat center/cover;
    height:100vh;
    color:white;
}

.container{
    width:100%;
    padding:20px;
    backdrop-filter: blur(6px);
}

.titulo{
    text-align:center;
    margin-top:30px;
    font-size:34px;
    font-weight:700;
    letter-spacing:2px;
}

.subtitulo{
    text-align:center;
    font-size:16px;
    opacity:0.8;
    margin-bottom:20px;
}

.card{
    width:90%;
    margin:auto;
    border:1px solid rgba(0,255,255,0.3);
    border-radius:20px;
    padding:20px;
    backdrop-filter:blur(10px);
    background:rgba(0,30,40,0.35);
}

label{font-size:18px;margin:5px 0;display:block;}
input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid rgba(0,255,255,0.25);
    background:rgba(255,255,255,0.05);
    color:white;
    margin-bottom:15px;
}

.grid-icones{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
    margin-top:20px;
}

.icone{
    background:rgba(0,255,255,0.08);
    border:1px solid rgba(0,255,255,0.3);
    border-radius:15px;
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:center;
}
.icone img{width:60px;}

.mulher{
    position:absolute;
    right:10px;
    bottom:0;
    width:45%;
    max-width:360px;
}

.menu{
    position:fixed;
    bottom:0;
    width:100%;
    background:rgba(0,255,255,0.08);
    backdrop-filter:blur(5px);
    border-top:1px solid rgba(0,255,255,0.3);
    display:flex;
    justify-content:space-around;
    padding:14px;
}
.menu a{
    color:white;
    text-decoration:none;
    font-size:18px;
}
</style>
</head>
<body>

<div class="container">
    <h1 class="titulo">ReviTARIUM v14</h1>
    <h3 class="subtitulo">Clinical Biomechanics Intelligence</h3>

    <div class="card">
        <label>ID do Paciente</label>
        <input type="text" placeholder="Ex: 123">

        <label>Inserir Nível Vertebral</label>
        <input type="text" placeholder="Ex: T7 – 12°">

        <div class="grid-icones">
            <div class="icone"><img src="assets/ico-cranio.png"></div>
            <div class="icone"><img src="assets/ico-coluna1.png"></div>
            <div class="icone"><img src="assets/ico-coluna2.png"></div>
            <div class="icone"><img src="assets/ico-torax.png"></div>
            <div class="icone"><img src="assets/ico-bacia.png"></div>
            <div class="icone"><img src="assets/ico-perna.png"></div>
            <div class="icone"><img src="assets/ico-full.png"></div>
        </div>
    </div>
</div>

<img class="mulher" src="assets/mulher.webp">

<div class="menu">
    <a href="#">Início</a>
    <a href="#">Evolução</a>
    <a href="#">Previsão</a>
</div>

</body>
</html>
