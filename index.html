<!DOCTYPE html>

<title>ReviTARIUM v14</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- FUNDO -->
<img src="assets/fundo.webp" class="fundo">

<!-- TÍTULO -->

<!-- CONTEÚDO -->
<div class="conteudo">
    
    <!-- FORMULÁRIO -->
    <div class="formulario">
        <label>ID do Paciente</label>
        <input id="idPaciente" type="text" placeholder="Ex: 123">

        <label>Inserir Nível Vertebral</label>
        <input id="inputNivel" type="text" placeholder="Ex: T7 - 12°">

        <!-- ÍCONES -->
        <div class="icones-zonas">
            <img src="assets/ico-cranio.png" onclick="selecionarZona('cranio')">
            <img src="assets/ico-coluna1.png" onclick="selecionarZona('cervical')">
            <img src="assets/ico-coluna2.png" onclick="selecionarZona('toracica')">
            <img src="assets/ico-torax.png" onclick="selecionarZona('torax')">
            <img src="assets/ico-bacia.png" onclick="selecionarZona('pelve')">
            <img src="assets/ico-perna.png" onclick="selecionarZona('membros')">
            <img src="assets/ico-full.png" onclick="selecionarZona('full')">
        </div>
    </div>

    <!-- MULHER  -->
    <div class="painel-mulher">
        <img src="assets/mulher.webp" class="mulher">
    </div>

</div>
