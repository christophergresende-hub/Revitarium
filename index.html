<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium v14</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background">
  <img src="assets/fundo.webp" class="bg-img">
</div>

<header class="topo">
  <img src="assets/logo-revitarium.png" class="logo">
  <h1>ReviTARIUM v14</h1>
  <p>Clinical Biomechanics Intelligence</p>
</header>

<main class="painel">
  <label>ID do Paciente</label>
  <input type="text" placeholder="Ex: 123">

  <label>Inserir Nível Vertebral</label>
  <input type="text" placeholder="Ex: T7  •  12°">

  <section class="grid-icones">
    <img src="assets/ico-cranio.png" class="icon">
    <img src="assets/ico-coluna1.png" class="icon">
    <img src="assets/ico-coluna2.png" class="icon">
    <img src="assets/ico-torax.png" class="icon">
    <img src="assets/ico-bacia.png" class="icon">
    <img src="assets/ico-perna.png" class="icon">
    <img src="assets/ico-full.png" class="icon">
  </section>

  <img src="assets/mulher.webp" class="mulher">
</main>

<footer class="nav">
  <a class="ativo">Início</a>
  <a>Evolução</a>
  <a>Previsão</a>
</footer>

</body>
</html>
