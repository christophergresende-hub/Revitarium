<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolução Clínica • Revitarium</title>

<style>
:root{
    --verde-base:#6EC4B3;
    --verde-escuro:#151e26;
    --branco:#ffffff;
    --azul-botao:#003f63;
}

/* ====== BASE ====== */
body{
    margin:0;
    background:var(--branco);
    font-family:"Helvetica Neue", Arial, sans-serif;
    color:var(--verde-escuro);
}

/* ====== HEADER ====== */
header{
    background:var(--verde-base);
    color:var(--branco);
    text-align:center;
    padding:22px;
    font-size:1.45rem;
    font-weight:600;
    letter-spacing:0.03em;
}

/* ====== CONTAINER ====== */
.container{
    max-width:600px;
    margin:auto;
    padding:22px;
}

h2{
    font-size:1.25rem;
    font-weight:700;
    margin-bottom:14px;
    color:var(--verde-escuro);
}

.inputBox{
    width:100%;
    background:white;
    border:1px solid #b8e4d9;
    border-radius:10px;
    padding:14px;
    font-size:1rem;
    margin-bottom:12px;
}

/* BOTÃO PRINCIPAL */
.btnPrimary{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:var(--azul-botao);
    color:var(--branco);
    font-size:1.1rem;
    font-weight:600;
    margin-top:8px;
}

/* ====== TERMINAL ====== */
.terminal{
    background:#E8F9F5;
    border-left:5px solid var(--verde-base);
    padding:18px;
    border-radius:10px;
    margin-top:20px;
    font-size:0.9rem;
    font-family:monospace;
    white-space:pre-wrap;
    color:#002c2c;
    min-height:120px;
}

/* ====== MENU INFERIOR ====== */
.navBottom{
    position:fixed;
    bottom:0; left:0; width:100%;
    background:var(--verde-base);
    padding:12px 0;
    display:flex;
    justify-content:space-around;
}
.navBottom button{
    background:none;
    border:none;
    color:white;
    font-size:1rem;
}
</style>
</head>
<body>

<header>Evolução Clínica</header>

<div class="container">

    <h2>Consultar evolução do paciente</h2>
    <input id="patientID" class="inputBox" placeholder="ID do Paciente (ex: 123)" />
    <button class="btnPrimary" onclick="buscarEvolucao()">📈 Consultar Evolução</button>

    <div id="terminal" class="terminal">Aguardando dados...</div>

</div>

<!-- NAVEGAÇÃO PADRÃO -->
<div class="navBottom">
    <button onclick="window.location.href='dashboard.html'">🏠 Dashboard</button>
    <button onclick="window.location.href='evolucao.html'">📈 Evolução</button>
    <button onclick="window.location.href='previsao.html'">🔮 Previsão</button>
</div>

<script>
/* BLOQUEIO SEM LOGIN */
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

/* === FUNÇÃO DE EVOLUÇÃO V7 === */
async function buscarEvolucao(){
    const id = document.getElementById("patientID").value.trim();
    const terminal = document.getElementById("terminal");

    if(!id){
        terminal.textContent = "Erro: informe o ID do paciente.";
        return;
    }

    terminal.textContent = "Consultando evolução...";

    try{
        const req = await fetch(`https://revitarium.onrender.com/workflow/patient/${id}/evolution`);
        const dados = await req.json();
        
        terminal.textContent =
        "📌 RESULTADO DA EVOLUÇÃO:\\n" +
        "---------------------------------------\\n" +
        `• Score Anterior: ${dados.previous_score || "N/D"}\\n` +
        `• Score Atual: ${dados.current_score || "N/D"}\\n` +
        `• Variação (Δ): ${dados.delta || "N/D"}\\n` +
        `• Tendência: ${dados.trend || "N/D"}\\n`;
        
    }catch(e){
        terminal.textContent = "Erro: API não respondeu.";
    }
}
</script>

</body>
</html>
