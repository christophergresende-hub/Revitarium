<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolução</title></head>
<body style="background:#0d0d0d;color:white;font-family:Arial;padding:20px">
<h2>📈 Evolução Clínica</h2>
<input id="pid" placeholder="ID do paciente">
<button onclick="load()">Consultar</button>
<pre id="out" style="color:#0f0;background:black;padding:20px;border-radius:10px"></pre>

<script>
if(localStorage.getItem("revitarium_logged")!=="yes"){window.location.href="index.html";}
async function load(){
 const id=document.getElementById("pid").value;
 const r=await fetch(`https://revitarium.onrender.com/workflow/patient/${id}/evolution`);
 document.getElementById("out").textContent=JSON.stringify(await r.json(),null,2);
}
</script>
</body>
</html>
