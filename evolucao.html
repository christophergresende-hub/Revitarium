<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolução Clínica • Revitarium</title>

<style>
:root {
    --verde-base:#6EC4B3;
    --verde-escuro:#151e26;
    --branco:#ffffff;
    --texto:#0f2322;
}

body{
    margin:0;
    font-family:"Helvetica Neue",Arial,sans-serif;
    background:white;
}

/* SOBREPOSIÇÃO */
.bg-wrapper{
    display:flex; height:220px; width:100%;
    background:var(--verde-base);
    position:relative; overflow:hidden;
}
.bg-wrapper:before{
    content:""; position:absolute; left:0;top:0;
    width:17%;height:100%; background:var(--verde-escuro);
}
.overlay-title{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    color:white; font-size:1.3rem; font-weight:bold;
    letter-spacing:0.15em; text-transform:uppercase;
}

.container{
    padding:20px; max-width:550px; margin:auto;
}
h2{
    color:var(--verde-escuro);
    text-transform:uppercase;
}
input{
    width:100%; padding:14px; margin:10px 0;
    background:white; border-radius:10px;
    border:1px solid #9fd6c8; font-size:1rem; color:var(--texto);
}
button{
    width:100%; padding:15px; margin:8px 0;
    border-radius:10px; font-size:1rem; font-weight:bold;
    border:none; cursor:pointer;
}
.btn-solid{ background:var(--verde-base); color:#002926; }
.btn-outline{ background:white; border:2px solid var(--verde-base); color:var(--verde-escuro); }

.chart-box{
    background:white; border-radius:14px;
    padding:15px; margin-top:25px; border:2px solid var(--verde-base);
}
.terminal{
    background:#F5FFFD; border-left:6px solid var(--verde-base);
    padding:15px; border-radius:10px; font-family:monospace;
    min-height:120px; white-space:pre-wrap;
}
.menu-bottom{
    position:fixed; bottom:0; left:0; width:100%;
    background:var(--verde-escuro); padding:12px 0;
    display:flex; justify-content:space-around;
}
.menu-bottom button{
    background:none; border:none; color:white; font-size:1rem;
}
</style>
</head>
<body>

<div class="bg-wrapper">
    <div class="overlay-title">Evolução Clínica</div>
</div>

<div class="container">

    <h2>ID do Paciente</h2>
    <input id="patientId" placeholder="Ex: 123">

    <button class="btn-solid" id="consultar">📈 Consultar Evolução</button>

    <div class="chart-box">
        <canvas id="evolucaoChart"></canvas>
    </div>

    <h2>Retorno da API</h2>
    <pre id="terminal" class="terminal">Aguardando...</pre>

    <button class="btn-outline" onclick="nav('dashboard.html')">🔙 Voltar ao Dashboard</button>
</div>

<div class="menu-bottom">
    <button onclick="nav('dashboard.html')">🏠 Início</button>
    <button onclick="nav('evolucao.html')">📈 Evolução</button>
    <button onclick="nav('previsao.html')">🔮 Previsão</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href="index.html";
}

function nav(p){ window.location.href=p }

document.getElementById("consultar").onclick = async ()=>{
    const id = patientId.value.trim();
    const out = document.getElementById("terminal");
    if(!id){ out.textContent="Digite o ID do paciente."; return; }

    out.textContent="Consultando evolução...";
    try{
        const r = await fetch(`https://revitarium.onrender.com/workflow/patient/${id}/evolution`);
        const json = await r.json();
        out.textContent = JSON.stringify(json,null,2);

        // Gráfico
        const labels = json.history.map(item => item.date || "Data");
        const valores = json.history.map(item => item.angle || 0);

        new Chart(document.getElementById("evolucaoChart"),{
            type:"line",
            data:{
                labels:labels,
                datasets:[{
                    label:"Ângulos / Progressão",
                    data:valores,
                    borderColor:"#151e26",
                    backgroundColor:"rgba(21,30,38,0.25)",
                    borderWidth:3,
                    pointRadius:5,
                    pointBackgroundColor:"#6EC4B3"
                }]
            },
            options:{responsive:true,maintainAspectRatio:false}
        });
    }catch(err){
        out.textContent="Erro ao consultar API";
    }
};
</script>

</body>
</html>
