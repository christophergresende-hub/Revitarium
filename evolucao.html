<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revitarium – Evolução Clínica</title>

<style>
    body { background: #0c0c0c; color: white; font-family: Arial; margin: 0; }
    header { background: #002a52; padding: 18px; text-align: center; font-weight: bold; }
    .container { padding: 20px; }
    button {
        width: 100%; padding: 15px; margin: 8px 0; border-radius: 8px;
        border: none; font-weight: bold; font-size: 1rem;
    }
    .btn { background: #007bff; color: white; }
    .btn-danger { background: #8B0000; color: white; }
    .terminal {
        background: black; color: #00ff00; padding: 20px;
        border-radius: 10px; margin-top: 20px; min-height: 160px;
        font-family: monospace; white-space: pre-wrap;
    }
</style>
</head>
<body>

<header>📈 Revitarium – Evolução Clínica</header>

<div class="container">
    <h2>Consultar evolução do paciente</h2>
    <input type="text" id="patientId" placeholder="Ex: 123" style="padding:12px;width:100%;border-radius:8px">
    <button id="consultar" class="btn">🔎 Consultar evolução</button>
    <button id="voltar" class="btn">⬅ Voltar ao Dashboard</button>
    <button id="logout" class="btn-danger">⛔ Sair</button>

    <h3>Retorno:</h3>
    <div id="terminal" class="terminal">Aguardando consulta...</div>
</div>

<script>
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

document.getElementById("voltar").onclick = () => {
    window.location.href = "dashboard.html";
};
document.getElementById("logout").onclick = () => {
    localStorage.removeItem("revitarium_logged");
    window.location.href = "index.html";
};

document.getElementById("consultar").onclick = async () => {
    const p = document.getElementById("patientId").value.trim();
    const terminal = document.getElementById("terminal");

    if(!p){ terminal.textContent = "Digite o ID do paciente"; return; }

    terminal.textContent = "Consultando evolução...";
    try{
        const r = await fetch(`https://revitarium.onrender.com/workflow/patient/${p}/evolution`);
        const data = await r.json();
        terminal.textContent = JSON.stringify(data, null, 2);
    } catch(e){
        terminal.textContent = "Erro ao conectar com a API.";
    }
};
</script>

</body>
</html>
