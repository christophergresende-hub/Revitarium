<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolução Clínica – Revitarium</title>
<style>
    body {
        background:#0c0c0c; margin:0; font-family: Arial, sans-serif; color:white;
    }
    header {
        background:#8A0000;
        padding:18px;
        text-align:center;
        font-size:1.3rem;
        font-weight:bold;
    }
    .container {
        padding:22px;
    }
    input, button {
        width:100%;
        padding:16px;
        font-size:1rem;
        border-radius:10px;
        border:none;
        margin:10px 0;
    }
    input {
        background:#111;
        color:white;
    }
    .btn {
        background:#b40000;
        color:white;
        font-weight:bold;
    }
    .btn-back {
        background:#444;
        color:white;
        font-weight:bold;
    }
    .box {
        background:#111;
        padding:18px;
        border-radius:10px;
        margin-top:20px;
        white-space:pre-wrap;
        font-family:monospace;
        font-size:.95rem;
    }
</style>
</head>
<body>

<header>📈 Evolução Clínica</header>

<div class="container">

    <h2>Consultar evolução do paciente</h2>
    <input type="text" id="pid" placeholder="ID do Paciente (ex: 123)" />

    <button class="btn" id="consultar">Consultar Evolução</button>
    <button class="btn-back" onclick="window.location.href='dashboard.html'">⬅ Voltar</button>

    <div id="resposta" class="box">Aguardando busca...</div>

</div>

<script>
/* BLOQUEIO SEM LOGIN */
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

/* CONSULTA API */
document.getElementById("consultar").onclick = async () => {
    const pid = document.getElementById("pid").value.trim();
    const url = `https://revitarium.onrender.com/workflow/patient/${pid}/evolution`;
    const box = document.getElementById("resposta");

    if(!pid){
        box.textContent = "Erro: informe um patient_id.";
        return;
    }

    box.textContent = "Buscando dados...";

    try{
        const r = await fetch(url);
        const json = await r.json();
        box.textContent = JSON.stringify(json, null, 2);
    }catch(e){
        box.textContent = "Erro ao conectar com a API.";
    }
};
</script>

</body>
</html>
