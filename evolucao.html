<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Revitarium • Evolução Clínica</title>

<!-- Gráfico Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        margin: 0;
        background: #f4f9ff;
        font-family: Arial, sans-serif;
        color: #003b63;
    }
    header {
        background: #0068a8;
        padding: 20px;
        text-align: center;
        font-size: 1.4rem;
        font-weight: bold;
        color: white;
    }
    .container {
        padding: 20px;
    }
    input, button {
        width: 100%;
        padding: 15px;
        margin: 8px 0;
        border-radius: 10px;
        border: none;
        font-size: 1rem;
    }
    input {
        background: white;
        border: 2px solid #d6e9f7;
    }
    .btn-primary {
        background: #0076c5;
        color: white;
        font-weight: bold;
    }
    .card {
        background: #ffffff;
        padding: 18px;
        border-radius: 12px;
        margin-top: 18px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    #resultado {
        background: #e9f5ff;
        border-left: 4px solid #0076c5;
        padding: 15px;
        border-radius: 8px;
        font-family: monospace;
        white-space: pre-wrap;
        margin-top: 10px;
    }
    /* MENU APP FIXO */
    .nav-bottom {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: #003b63;
        display: flex;
        justify-content: space-around;
        padding: 12px 0;
    }
    .nav-bottom button {
        background: none;
        border: none;
        color: white;
        font-size: 1rem;
        font-weight: bold;
    }
</style>
</head>

<body>

<header>Evolução Clínica • Hospital Premium</header>

<div class="container">

    <h2>ID do Paciente</h2>
    <input id="patientId" placeholder="Ex: 123"/>

    <button class="btn-primary" id="buscarDados">📈 Carregar Evolução</button>

    <div class="card">
        <h3>Histórico Longitudinal (Scores)</h3>
        <canvas id="graficoEvolucao" height="180"></canvas>
    </div>

    <div class="card">
        <h3>Dados Brutos</h3>
        <div id="resultado">Aguardando consulta...</div>
    </div>

</div>

<!-- NAVEGAÇÃO INFERIOR -->
<div class="nav-bottom">
    <button onclick="window.location.href='dashboard.html'">🏥 Dashboard</button>
    <button onclick="window.location.href='evolucao.html'">📈 Evolução</button>
    <button onclick="window.location.href='previsao.html'">🔍 Previsão</button>
</div>

<script>
/* Proteção de acesso */
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

const ctx = document.getElementById("graficoEvolucao").getContext("2d");
let grafico;

/* Carregar evolução */
document.getElementById("buscarDados").onclick = async () => {
    const id = document.getElementById("patientId").value.trim();
    const box = document.getElementById("resultado");

    if(!id){ box.textContent = "Insira o ID do paciente."; return; }

    box.textContent = "Consultando API...";

    try {
        const res = await fetch(`https://revitarium.onrender.com/workflow/patient/${id}/evolution`);
        const data = await res.json();

        box.textContent = JSON.stringify(data, null, 2);

        const scores = data.history.map(item => item.global_score);
        const labels = data.history.map(item => item.timestamp.split("T")[0]);

        if(grafico) grafico.destroy();

        grafico = new Chart(ctx, {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Score Clínico",
                    data: scores,
                    borderColor: "#0076c5",
                    backgroundColor: "rgba(0,118,197,0.15)",
                    borderWidth: 3,
                    pointRadius: 4,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                animation: { duration: 1200 },
                scales: {
                    y: { beginAtZero: false }
                }
            }
        });

    } catch(e) {
        box.textContent = "Erro ao consultar API ou paciente inexistente.";
    }
};
</script>

</body>
</html>
