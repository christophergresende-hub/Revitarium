<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Evolução Clínica – Revitarium</title>

<style>
body{
    background:#0c0c0c;
    color:white;
    font-family:Arial, sans-serif;
    margin:0; padding:0;
}
header{
    background:#002a52;
    padding:18px;
    text-align:center;
    font-size:1.3rem;
    font-weight:bold;
}
.container{
    padding:20px;
}
input, button{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    font-size:1rem;
}
input{
    background:#111;
    color:white;
}
.btn{background:#007bff;color:white;font-weight:bold;}
.btn-danger{background:#8B0000;color:white;}
.card{
    background:#111;
    padding:18px;
    border-radius:10px;
    margin-top:20px;
}
label{opacity:0.7;font-size:0.9rem;}
.highlight{
    font-size:1.4rem;
    font-weight:bold;
    margin:6px 0;
}
.trend-melhora{color:#00ff88;}
.trend-piora{color:#ff4444;}
.trend-estavel{color:#ffc107;}
</style>
</head>
<body>

<header>📈 Evolução Clínica do Paciente</header>

<div class="container">

    <label>ID do Paciente</label>
    <input type="text" id="pacienteId" placeholder="Ex: 123" />

    <button class="btn" id="btnConsultar">Consultar Evolução</button>
    <button class="btn-danger" id="btnVoltar">⬅ Voltar para o Dashboard</button>

    <div id="resultado" class="card">Aguardando consulta...</div>

</div>

<script>
/* =======================================================
   BLOQUEIO DE ACESSO
==========================================================*/
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

/* =======================================================
   BOTÕES
==========================================================*/
document.getElementById("btnVoltar").onclick = ()=>{
    window.location.href = "dashboard.html";
};

/* =======================================================
   CONSULTA DE EVOLUÇÃO AVANÇADA
==========================================================*/
document.getElementById("btnConsultar").onclick = async () => {
    const id = document.getElementById("pacienteId").value.trim();
    const box = document.getElementById("resultado");

    if(!id){
        box.textContent = "⚠️ Informe um ID de paciente para consultar.";
        return;
    }

    box.textContent = "🔄 Consultando API...";

    try{
        const url = `https://revitarium.onrender.com/workflow/patient/${id}/evolution`;
        const res = await fetch(url);
        const data = await res.json();

        if(data.error){
            box.textContent = "❌ Paciente sem histórico suficiente.";
            return;
        }

        let cor = "trend-estavel";
        if(data.trend === "melhora") cor = "trend-melhora";
        if(data.trend === "piora") cor = "trend-piora";

        box.innerHTML = `
            <div class="highlight ${cor}">📊 Tendência: ${data.trend.toUpperCase()}</div>
            <div>Último Score: <b>${data.current_score ?? "?"}</b></div>
            <div>Anterior: <b>${data.previous_score ?? "?"}</b></div>
            <div>Variação (Delta): <b>${data.delta ?? "?"}</b></div>
            <br>
            <h3>📍 Histórico Completo</h3>
            <pre>${JSON.stringify(data.history, null, 2)}</pre>
        `;
    }
    catch(err){
        box.textContent = "❌ Erro ao conectar com a API.";
    }
}
</script>

</body>
</html>
