<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revitarium • Evolução Clínica v13 ULTRA</title>

<style>
    body{
        margin:0;
        font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
        background:#050505;
        color:white;
    }
    header{
        background:#002A52;
        text-align:center;
        padding:20px;
        font-size:1.4rem;
        font-weight:600;
        position:sticky; top:0;
    }
    .container{max-width:460px;margin:auto;padding:20px;}

    input, button{
        width:100%;padding:14px;margin:8px 0;border-radius:10px;
        border:none;font-size:1rem;
    }
    input{background:#111;color:white;}
    .btn{background:#0A84FF;color:white;font-weight:bold;}

    .card{
        background:#111;padding:20px;margin:20px 0;border-radius:14px;
        box-shadow:0 0 12px rgba(0,0,0,0.5);
    }
    .result{
        font-size:1rem;line-height:1.6;
        background:black;border-radius:12px;padding:15px;
        white-space:pre-wrap;font-family:monospace;color:#00ff7b;
        min-height:140px;
    }

    /* Barra de evolução */
    .barbox{margin-top:10px;}
    .bar{
        background:#222;height:14px;border-radius:8px;overflow:hidden;
        position:relative;
    }
    .bar-fill{
        background:linear-gradient(90deg,#00ff7b,#0080ff);
        height:100%;transition:0.6s;width:0%;
    }

    /* NAV inferior */
    nav{
        position:fixed;bottom:0;width:100%;background:#000;
        display:flex;justify-content:space-around;padding:12px 0;
        border-top:1px solid #222;
    }
    nav button{
        flex:1;margin:0 4px;padding:12px;border-radius:10px;
        background:#0A84FF;font-weight:bold;color:white;
    }
</style>
</head>
<body>

<header>📈 Evolução Clínica – v13 ULTRA</header>

<div class="container">

    <h3>ID do Paciente</h3>
    <input id="patientId" type="text" placeholder="Ex: 123">

    <button class="btn" id="consultar">Consultar Evolução</button>
    <button class="btn" id="pdfBtn">📄 Gerar PDF Clínico</button>

    <div class="card">
        <h3>Resultado Atual:</h3>
        <div class="result" id="terminal">Aguardando...</div>

        <div class="barbox">
            <small>Score Atual</small>
            <div class="bar"><div class="bar-fill" id="barScore"></div></div>
        </div>

        <div class="barbox">
            <small>Delta de Evolução</small>
            <div class="bar"><div class="bar-fill" id="barDelta"></div></div>
        </div>
    </div>

</div>

<nav>
    <button onclick="location.href='dashboard.html'">🏠 Início</button>
    <button onclick="location.href='evolucao.html'" style="background:#0071E3;">📈 Evolução</button>
    <button onclick="location.href='previsao.html'">🔮 Previsão</button>
</nav>

<script>
// Proteção de acesso
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

// Consultar evolução
document.getElementById("consultar").onclick = async () => {
    const id = document.getElementById("patientId").value.trim();
    const out = document.getElementById("terminal");
    if(!id){ out.textContent="Digite um ID."; return; }

    out.textContent="🔄 Consultando evolução...";

    try{
        const res = await fetch(`https://revitarium.onrender.com/workflow/patient/${id}/evolution`);
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);

        // anima barra score (0-100)
        if(data.current_score){
            document.getElementById("barScore").style.width = `${data.current_score}%`;
        }

        // anima barra delta (-/+/)
        if(data.delta){
            let delta = Math.abs(data.delta)*10;
            if(delta > 100) delta = 100;
            document.getElementById("barDelta").style.width = `${delta}%`;
        }

    }catch(e){
        out.textContent="❌ Erro ao conectar com a API";
    }
};

// PDF Clínico
document.getElementById("pdfBtn").onclick = () => {
    const id = prompt("Paciente para PDF:");
    if(id){
        window.open(`https://revitarium.onrender.com/workflow/patient/${id}/report/pdf`, "_blank");
    }
};
</script>

</body>
</html>
