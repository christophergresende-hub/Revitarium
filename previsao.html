<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revitarium • Previsão Clínica Militar</title>

<style>
body{
    margin:0;
    background:#0a0f0f;
    font-family:Arial, sans-serif;
    color:#e0ffe0;
}

header{
    background:#021a18;
    padding:20px;
    text-align:center;
    color:#76ff03;
    font-weight:bold;
    font-size:1.4rem;
    border-bottom:2px solid #0f3;
}

.container{
    padding:20px;
}

input,button{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:6px;
    border:none;
    font-size:1rem;
}

input{
    background:#0d1a1a;
    color:#76ff03;
    border:1px solid #093;
}

button{
    background:#093;
    color:white;
    font-weight:bold;
}

button:hover{ background:#0c5; cursor:pointer; }

#resultado{
    background:black;
    color:#0f0;
    margin-top:20px;
    padding:20px;
    border-radius:8px;
    font-family:monospace;
    white-space:pre-wrap;
    min-height:140px;
}

/* Botões inferiores */
.navbar{
    position:fixed;
    bottom:0; left:0; width:100%;
    background:#021a18;
    display:flex;
    border-top:2px solid #0f3;
}
.navbar button{
    flex:1;
    border-radius:0;
    border-right:1px solid #062;
}
</style>
</head>
<body>

<header>🛡️ Previsão Clínica • Protocolo Militar</header>

<div class="container">
    <h3>ID do Paciente</h3>
    <input id="patientId" placeholder="Ex: 123">

    <button id="btnPrever">📡 Rodar Previsão</button>

    <div id="resultado">Aguardando parâmetros...</div>
</div>

<div class="navbar">
    <button onclick="location.href='dashboard.html'">🏠 Início</button>
    <button onclick="location.href='evolucao.html'">📈 Evolução</button>
    <button onclick="location.href='previsao.html'">🔮 Previsão</button>
</div>

<script>
/* BLOQUEIO DE LOGIN */
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

/* EXECUTAR PREVISÃO */
document.getElementById("btnPrever").onclick = async () => {
    const patientId = document.getElementById("patientId").value.trim();
    const box = document.getElementById("resultado");

    if(!patientId){
        box.textContent = "ERRO: informe o ID do paciente.";
        return;
    }

    box.textContent = "🔍 Consultando IA tática...";

    try{
        const url = `https://revitarium.onrender.com/workflow/patient/${patientId}/predict`;
        const res = await fetch(url);
        const data = await res.json();
        box.textContent = JSON.stringify(data, null, 2);
    }
    catch(e){
        box.textContent = "❌ Falha de comunicação com a API";
    }
};
</script>

</body>
</html>
