<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revitarium • Previsão Clínica v14 Premium</title>

<!-- Chart.js para gráfico médico premium -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body{
        margin:0;
        background:#050505;
        font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
        color:white;
    }
    header{
        background:#002A52;
        padding:18px;
        text-align:center;
        font-size:1.4rem;
        font-weight:bold;
        position:sticky; top:0;
    }
    .container{
        max-width:460px;
        margin:auto;
        padding:20px;
    }
    input, button{
        width:100%;
        padding:14px;
        margin:8px 0;
        font-size:1rem;
        border:none;
        border-radius:10px;
    }
    input{background:#111;color:white;}
    .btn{background:#0A84FF;color:white;font-weight:bold;}
    .btn-danger{background:#8B0000;}
    .card{
        background:#0F0F0F;
        padding:20px;
        border-radius:14px;
        margin:20px 0;
    }
    /* NAV inferior */
    nav{
        position:fixed;
        bottom:0;width:100%;background:black;
        display:flex;gap:6px;padding:10px;
        border-top:1px solid #1a1a1a;
    }
    nav button{
        flex:1;
        padding:12px;
        border-radius:10px;
        background:#0A84FF;
        color:white;
        font-weight:bold;
        border:none;
    }
</style>
</head>
<body>

<header>🔮 Previsão Clínica Premium</header>

<div class="container">
    
    <h3>ID do Paciente</h3>
    <input type="text" id="patientId" placeholder="Ex: 123">

    <button class="btn" id="predictBtn">Calcular Previsão</button>

    <div class="card">
        <h3>Resultado Clínico Previsto</h3>
        <pre id="result" style="white-space:pre-wrap;color:#9DFFCE;">Aguardando previsão...</pre>
    </div>

    <canvas id="evolutionChart" height="220"></canvas>

</div>

<nav>
    <button onclick="location.href='dashboard.html'">🏠 Dashboard</button>
    <button onclick="location.href='evolucao.html'">📈 Evolução</button>
    <button style="background:#0071E3;">🔮 Previsão</button>
    <button onclick="location.href='index.html'" class="btn-danger">⛔ Sair</button>
</nav>

<script>
// impede acesso sem login
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

let chart; // gráfico global

document.getElementById("predictBtn").onclick = async () =>{
    const id = document.getElementById("patientId").value.trim();
    const out = document.getElementById("result");

    if(!id){ out.textContent="Digite um ID."; return; }

    out.textContent="🔄 Calculando previsão...";

    try{
        const res = await fetch(`https://revitarium.onrender.com/workflow/patient/${id}/predict`);
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);

        /* ======== Montando pontos do gráfico ======== */
        if(data.history || data.previous_score || data.current_score){

            // Chamada para pegar evolução real para plotar histórico do gráfico
            const evo = await fetch(`https://revitarium.onrender.com/workflow/patient/${id}/evolution`);
            const hist = await evo.json();

            const labels = hist.history.map(r => {
                const t = r.timestamp.split("T")[0];
                return t;
            });

            const scores = hist.history.map(r => r.global_score);

            const projection = data.projecao_score ? data.projecao_score : scores[scores.length-1];

            // destruir gráfico anterior para recriar atualizado
            if(chart){ chart.destroy(); }

            const ctx = document.getElementById("evolutionChart").getContext("2d");
            chart = new Chart(ctx, {
                type:"line",
                data:{
                    labels:[...labels,"PREVISÃO"],
                    datasets:[
                        {
                            label:"Score Biomecânico",
                            data:[...scores, projection],
                            borderColor:"#00FF9D",
                            backgroundColor:"rgba(0,255,157,0.2)",
                            tension:0.4,
                            borderWidth:3,
                            pointRadius:6,
                        }
                    ]
                },
                options:{
                    responsive:true,
                    scales:{
                        y:{min:0,max:100,ticks:{color:"#fff"}},
                        x:{ticks:{color:"#fff"}}
                    }
                }
            });
        }

    }catch(e){
        out.textContent="❌ Erro ao conectar à API";
    }
};
</script>

</body>
</html>
