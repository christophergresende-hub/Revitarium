<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium • Hospital Premium</title>
<style>
body{
    margin:0; background:#ffffff; font-family:Arial, sans-serif; color:#003B64;
}
header{
    background:#0077B6; color:white; padding:18px; text-align:center;
    font-size:1.3rem; font-weight:bold;
}
.container{
    padding:20px; max-width:600px; margin:auto;
}
input,button{
    width:100%; padding:15px; margin:8px 0; font-size:1rem; border-radius:10px;
}
input{
    border:1px solid #bcd7e9; background:#f8fcff;
}
button{
    background:#0077B6; color:white; border:none; font-weight:bold;
}
.card{
    margin-top:18px; background:#EBF7FF; padding:15px; border-radius:12px; border-left:6px solid #0077B6;
}
.nav{
    display:flex; gap:6px; margin-top:20px;
}
.nav button{
    flex:1; background:#013B64; padding:14px; border:none; color:white; border-radius:10px;
}
</style>
</head>
<body>

<header>Hospital Premium</header>
<div class="container">

<h2>Consultar Previsão</h2>
<input id="patientId" placeholder="ID do Paciente (ex: 123)">
<button id="btnPrever">Prever Condição Clínica</button>

<div id="resultado" class="card">Aguardando dados...</div>

<div class="nav">
    <button onclick="location.href='dashboard.html'">Dashboard</button>
    <button onclick="location.href='evolucao.html'">Evolução</button>
    <button onclick="location.href='previsao.html'">Previsão</button>
</div>

</div>

<script>
if(localStorage.getItem("revitarium_logged")!=="yes") location.href="index.html";

document.getElementById("btnPrever").onclick = async ()=>{
    const id=document.getElementById("patientId").value.trim();
    const out=document.getElementById("resultado");
    if(!id) return out.textContent="Informe um ID válido.";

    out.textContent="Carregando...";
    const r=await fetch(`https://revitarium.onrender.com/workflow/patient/${id}/predict`);
    out.textContent=JSON.stringify(await r.json(),null,2);
};
</script>
</body>
</html>
