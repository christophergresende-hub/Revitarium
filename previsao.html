<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Revitarium • Sports Science Lab</title>
<style>
body{
    margin:0;background:#e8ecf1;font-family:Arial, sans-serif;color:#111;
}
header{
    background:#0B1C36;color:white;padding:20px;text-align:center;
    font-size:1.4rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;
}
.container{padding:20px;max-width:650px;margin:auto;}
input,button{
    width:100%;padding:15px;margin:8px 0;font-size:1rem;border-radius:12px;
}
input{background:white;border:2px solid #003566;font-weight:bold;}
button{background:#003566;color:white;border:none;font-weight:bold;}
.card{
    background:white;padding:18px;margin-top:18px;border-radius:14px;
    border-left:6px solid #003566;box-shadow:0 4px 12px rgba(0,0,0,.12);
}
</style>
</head>
<body>

<header>Sports Science • High Performance Lab</header>

<div class="container">
    <h2>Análise de Projeção</h2>
    <input id="patientId" placeholder="ID do Atleta">
    <button id="btnPrever">Gerar Previsão de Performance</button>

    <div id="resultado" class="card">Aguardando dados biomecânicos...</div>
</div>

<script>
if(localStorage.getItem("revitarium_logged")!=="yes") location.href="index.html";

btnPrever.onclick=async()=>{
    const id=patientId.value.trim();
    if(!id) return resultado.textContent="Informe o ID do atleta.";

    resultado.textContent="Calculando projeção biomecânica...";
    const r=await fetch(`https://revitarium.onrender.com/workflow/patient/${id}/predict`);
    resultado.textContent=JSON.stringify(await r.json(),null,2);
};
</script>
</body>
</html>
