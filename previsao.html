<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Previsão Clínica • Revitarium</title>

<style>
body{font-family:Arial;margin:0;background:#121212;color:white;padding:20px;}
.container{max-width:430px;margin:auto;background:#1f1f1f;border-radius:14px;padding:22px;}
input,button{width:100%;padding:12px;margin-top:10px;font-size:16px;border-radius:8px;border:none;}
button{background:#3b82f6;color:white;font-weight:bold;}
button:hover{background:#2563eb;}
.card{background:#292929;padding:16px;border-radius:10px;margin-top:18px;}
.tag{padding:6px 12px;border-radius:6px;font-size:15px;font-weight:bold;margin-top:6px;display:inline-block;}
.verde{background:#16a34a;color:white;}
.amarelo{background:#eab308;color:black;}
.vermelho{background:#dc2626;color:white;}
footer{text-align:center;margin-top:25px;opacity:.5;}
</style>
</head>

<body>

<script>
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}
</script>

<div class="container">
<h2>Previsão Clínica</h2>

<label>ID do Paciente</label>
<input type="text" id="patientId" value="123">

<button onclick="prever()">Calcular Previsão</button>
<button style="background:#444" onclick="window.location.href='dashboard.html'">Voltar ao Dashboard</button>

<div id="result"></div>
</div>

<footer>Revitarium • Projeção biomecânica e longitudinal</footer>

<script>
async function prever(){
    const id = document.getElementById("patientId").value.trim();
    const url = `https://revitarium.onrender.com/workflow/patient/${id}/predict`;

    const res = await fetch(url);
    const data = await res.json();

    if(data.message){
        document.getElementById("result").innerHTML = `
            <div class="card">
                <b>${data.message}</b><br><br>
                Realize mais avaliações para habilitar projeção clínica.
            </div>
        `;
        return;
    }

    const riskClass = data.risco_previsto === "verde" ? "verde" :
                      data.risco_previsto === "amarelo" ? "amarelo" : "vermelho";

    document.getElementById("result").innerHTML = `
        <div class="card">
            <h3>Próximo Score Previsto: <b>${data.projecao_score}</b></h3>
            <p>Variação média: <b>${data.variacao_media}</b></p>
            <span class="tag ${riskClass}">${data.risco_previsto.toUpperCase()}</span>
        </div>
        <div class="card">
            <h4>Dados completos:</h4>
            <pre style="white-space:pre-wrap;">${JSON.stringify(data, null, 2)}</pre>
        </div>
    `;
}
</script>

</body>
</html>
