<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revitarium – Previsão Clínica Avançada v8.2</title>

<style>
body{
    background:#0c0c0c;
    color:white;
    font-family:Arial, sans-serif;
    margin:0;
}
header{
    background:#002a52;
    padding:18px;
    text-align:center;
    font-size:1.3rem;
    font-weight:bold;
}
.container{
    padding:20px;
}
input, button{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    font-size:1rem;
}
input{background:#111;color:white;}
.btn{background:#007bff;color:white;font-weight:bold;}
.btn-danger{background:#8B0000;color:white;}
.card{
    background:#111;
    padding:18px;
    border-radius:10px;
    margin-top:20px;
}
.risco-verde{color:#00ff88;font-weight:bold;}
.risco-amarelo{color:#ffdd55;font-weight:bold;}
.risco-vermelho{color:#ff4444;font-weight:bold;}
.subtitle{opacity:0.7;font-size:0.9rem;}
.result-block{margin-top:12px;font-size:1.1rem;}
</style>
</head>
<body>

<header>🔮 Previsão Clínica Avançada v8.2</header>

<div class="container">

    <label>Paciente (ID):</label>
    <input type="text" id="pacienteId" placeholder="Ex: 123" />

    <button class="btn" id="btnPredict">Calcular Previsão</button>
    <button class="btn-danger" id="btnVoltar">⬅ Voltar ao Dashboard</button>

    <div id="resultado" class="card">Aguardando previsão...</div>
</div>

<script>
/* =======================================================
   BLOQUEIO DE ACESSO
==========================================================*/
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

/* =======================================================
   VOLTAR
==========================================================*/
document.getElementById("btnVoltar").onclick = ()=>{
    window.location.href = "dashboard.html";
};

/* =======================================================
   PREVISÃO v8.2 — Avançada sem regressão
==========================================================*/
document.getElementById("btnPredict").onclick = async () => {
    const box = document.getElementById("resultado");
    const id = document.getElementById("pacienteId").value.trim();

    if(!id){
        box.textContent = "⚠ Informe um ID de paciente.";
        return;
    }

    box.textContent = "🔄 Calculando previsão...";

    try{
        const url = `https://revitarium.onrender.com/workflow/patient/${id}/predict`;
        const res = await fetch(url);
        const data = await res.json();

        if(data.message){
            box.textContent = "❌ Dados insuficientes para previsão";
            return;
        }

        let cor = "risco-amarelo";
        if(data.risco_previsto === "verde") cor = "risco-verde";
        if(data.risco_previsto === "vermelho") cor = "risco-vermelho";

        // Projeção extra: semanas até melhora
        let semanas = "–";
        if(data.variacao_media > 0){
            semanas = Math.ceil((75 - data.projecao_score) / data.variacao_media);
            if(semanas < 0) semanas = "1–2 (em progresso)";
        }

        box.innerHTML = `
            <div class="result-block">
                <div>🔮 <b>Score Projetado:</b> ${data.projecao_score}</div>
                <div>📈 Variação média: <b>${data.variacao_media}</b> pts / avaliação</div>
                <div class="${cor}">🩺 Risco Previsto: <b>${data.risco_previsto.toUpperCase()}</b></div>
                <hr>
                <div class="subtitle">Estimativa até melhora clínica:</div>
                <div><b>${semanas}</b> avaliações (aprox.)</div>
            </div>
            <br>
            <h3>📌 Histórico Baseado no Cálculo</h3>
            <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
    }
    catch(err){
        box.textContent = "❌ Erro ao conectar com a API.";
    }
};
</script>

</body>
</html>
