<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium • Dashboard Clínico</title>

<style>
:root {
    --principal:#151e26;     /* Header e menu inferior */
    --botao:#6EC4B3;         /* Botões */
    --fundo:#E7F4F2;         /* Fundo hospitalar */
    --texto:#1A2A32;         /* Texto neutro clínico */
    --caixa:#FFFFFF;         /* Caixas e inputs */
}

body {
    margin:0;
    font-family: Arial, sans-serif;
    background: var(--fundo);
    color: var(--texto);
}

/* HEADER */
header{
    background: var(--principal);
    padding:20px;
    text-align:center;
    font-size:1.4rem;
    font-weight:bold;
    color:white;
    border-bottom:4px solid var(--botao);
}

/* ÁREA CENTRAL */
.container{
    max-width:550px;
    margin:auto;
    padding:22px;
}

/* INPUTS */
input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #C8E6E3;
    background:var(--caixa);
    font-size:1rem;
}

/* BOTÕES */
button{
    width:100%;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    font-size:1rem;
    font-weight:bold;
    border:none;
    cursor:pointer;
}

.btn-solid{
    background:var(--botao);
    color:#00322F;
}

.btn-menu{
    background:white;
    color:#00322F;
    border:2px solid var(--botao);
}

.btn-danger{
    background:#BF4747;
    color:white;
}

/* TERMINAL → CINZA CLARO (sem preto) */
.terminal{
    background:#FAFEFF;
    color:#00322F;
    padding:18px;
    border-radius:10px;
    border:1px solid #C8E6E3;
    min-height:120px;
    font-family:monospace;
    white-space:pre-wrap;
}

/* MENU INFERIOR */
.menu-bottom{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:var(--principal);
    padding:10px 0;
    display:flex;
    justify-content:space-around;
}

.menu-bottom button{
    background:none;
    border:none;
    color:white;
    font-size:1rem;
}
</style>
</head>
<body>

<header>Revitarium • Dashboard Clínico</header>

<div class="container">

    <h2>ID do Paciente</h2>
    <input id="pacienteId" placeholder="Ex: 123">

    <h2>Inserir Nível Vertebral</h2>
    <input id="vertebra" placeholder="Ex: T7">
    <input id="angulo" type="number" placeholder="Ex: 12 graus">

    <button class="btn-solid" id="enviarAnalise">🚑 Enviar para Análise</button>

    <h2>Consultas Rápidas</h2>
    <button class="btn-menu" onclick="nav('dashboard.html')">📊 Dashboard</button>
    <button class="btn-menu" onclick="nav('evolucao.html')">📈 Evolução</button>
    <button class="btn-menu" onclick="nav('previsao.html')">🔮 Previsão</button>
    <button class="btn-menu" onclick="nav('pdf.html')">📄 PDF Clínico</button>
    <button class="btn-danger" onclick="logout()">⛔ Sair</button>

    <h2>Retorno da API</h2>
    <pre id="terminal" class="terminal">Aguardando consulta...</pre>

</div>

<!-- MENU INFERIOR -->
<div class="menu-bottom">
    <button onclick="nav('dashboard.html')">🏠 Início</button>
    <button onclick="nav('evolucao.html')">📈 Evolução</button>
    <button onclick="nav('previsao.html')">🔮 Previsão</button>
</div>

<script>
// bloqueio
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

// navegação
function nav(p){ window.location.href = p; }

// logout
function logout(){
    localStorage.removeItem("revitarium_logged");
    window.location.href="index.html";
}

// API
document.getElementById("enviarAnalise").onclick = async () => {
    const id = pacienteId.value.trim();
    const v  = vertebra.value.trim();
    const a  = angulo.value.trim();
    const out = document.getElementById("terminal");

    if(!id || !v || !a){
        out.textContent = "Preencha ID, vértebra e ângulo.";
        return;
    }

    out.textContent = "Consultando API…";

    try{
        const r = await fetch(`https://revitarium.onrender.com/workflow/analyze/v4?patient_id=${id}`,{
            method:"POST",
            headers:{ "Content-Type":"application/json"},
            body:JSON.stringify([{vertebra:v, angle:Number(a)}])
        });
        const json = await r.json();
        out.textContent = JSON.stringify(json,null,2);
    }catch{
        out.textContent = "Erro de conexão.";
    }
}
</script>

</body>
</html>
