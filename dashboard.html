<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Revitarium – Dashboard Clínico v6</title>

<style>
    body {
        margin: 0;
        background: #0c0f16;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    header {
        background: #003366;
        padding: 16px;
        text-align: center;
        font-weight: bold;
        font-size: 1.3rem;
    }

    .container {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
    }

    .card {
        background: #111827;
        padding: 16px;
        border-radius: 14px;
        margin: 10px 0;
        border: 1px solid #1f2937;
    }
    .card-title {
        font-size: 1rem;
        color: #9ca3af;
    }
    .card-value {
        font-size: 1.8rem;
        font-weight: bold;
        margin-top: 6px;
    }
    .positivo { color: #00ff7f; }
    .negativo { color: #ff4d4d; }
    .estavel  { color: #e7c000; }

    .terminal {
        background: #000;
        color: #00ff00;
        padding: 16px;
        border-radius: 10px;
        margin-top: 12px;
        font-family: monospace;
        min-height: 120px;
        white-space: pre-wrap;
    }

    nav {
        background: #0b1a2e;
        display: flex;
        justify-content: space-around;
        padding: 10px 0;
        border-top: 1px solid #1f2d40;
    }
    nav button {
        flex: 1;
        background: none;
        color: #93a4b8;
        border: none;
        padding: 10px;
        font-size: .9rem;
    }
    nav button.active {
        color: white;
        border-bottom: 2px solid #007bff;
        font-weight: bold;
    }
</style>
</head>

<body>

<header>Revitarium – Dashboard Clínico v6</header>

<div class="container">
    
    <!-- CARDS DE MÉTRICAS -->
    <div class="card">
        <div class="card-title">Score Atual</div>
        <div id="scoreValor" class="card-value">--</div>
    </div>

    <div class="card">
        <div class="card-title">Tendência Clínica</div>
        <div id="tendenciaValor" class="card-value estavel">--</div>
    </div>

    <div class="card">
        <div class="card-title">Próxima Projeção</div>
        <div id="projecaoValor" class="card-value">--</div>
    </div>

    <!-- TERMINAL -->
    <div class="terminal" id="terminal">Carregando API...</div>
</div>

<!-- NAV BAR -->
<nav>
    <button class="active">📊 Dashboard</button>
    <button onclick="window.location.href='evolucao.html'">📈 Evolução</button>
    <button onclick="window.location.href='previsao.html'">🔮 Previsão</button>
    <button onclick="window.location.href='index.html'">⛔ Sair</button>
</nav>

<script>
// BLOQUEIO DE LOGIN
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

// AUTO-LOAD DOS DADOS
async function carregarDados(){
    const terminal = document.getElementById("terminal");

    try{
        // DASHBOARD
        const dash = await fetch("https://revitarium.onrender.com/workflow/patient/123/dashboard");
        const d = await dash.json();

        // PREVISÃO
        const prev = await fetch("https://revitarium.onrender.com/workflow/patient/123/predict");
        const p = await prev.json();

        document.getElementById("scoreValor").textContent = d.ultimo_score ?? "--";
        document.getElementById("tendenciaValor").textContent = p.risco_previsto ?? "--";
        document.getElementById("projecaoValor").textContent = p.projecao_score ?? "--";

        terminal.textContent = JSON.stringify({dashboard: d, previsao: p}, null, 2);

    } catch(err){
        terminal.textContent = "Erro ao conectar com API.";
    }
}
carregarDados();
</script>

</body>
</html>
