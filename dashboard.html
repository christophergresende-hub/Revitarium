<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium – Dashboard Clínico (v9)</title>

<style>
    body {
        margin: 0;
        background: #0B0B0B;
        font-family: Arial, sans-serif;
        color: white;
    }
    header {
        background: #003B72;
        padding: 22px;
        text-align: center;
        font-size: 1.4rem;
        font-weight: bold;
        letter-spacing: 0.4px;
    }
    .container {
        padding: 22px;
        max-width: 700px;
        margin: auto;
    }
    h2 {
        font-weight: bold;
        margin-top: 25px;
        font-size: 1.25rem;
    }
    input, button {
        width: 100%;
        padding: 15px;
        margin: 8px 0;
        border-radius: 10px;
        border: none;
        font-size: 1rem;
    }
    input { background: #111; color: #fff; }
    .btn-primary { background: #0078FF; font-weight: bold; }
    .btn-secondary { background: #1B1B1B; border: 1px solid #333; }
    .btn-danger { background: #B70000; font-weight: bold; }
    .card {
        background: #0F0F0F;
        padding: 18px;
        margin: 12px 0;
        border-radius: 14px;
        border: 1px solid #1F1F1F;
    }
    .api-box {
        background: black;
        color: #00FF00;
        font-family: monospace;
        padding: 18px;
        border-radius: 10px;
        min-height: 120px;
        margin-top: 20px;
        white-space: pre-wrap;
    }
</style>
</head>

<body>
<header>Revitarium – Dashboard Clínico (v9)</header>

<div class="container">

    <div class="card">
        <h2>ID do Paciente</h2>
        <input type="text" id="patientId" placeholder="Ex: 123">
    </div>

    <div class="card">
        <h2>Inserir Nível Vertebral</h2>
        <input type="text" id="vertebra" placeholder="Ex: T7">
        <input type="number" id="angulo" placeholder="Ex: 12 graus">
        <button class="btn-primary" id="enviarAnalise">🚑 Enviar para Análise</button>
    </div>

    <h2>Consultas Rápidas</h2>
    <button class="btn-primary" id="btnDashboardGeral">📊 Dashboard Geral</button>
    <button class="btn-primary" id="btnEvolucao">📈 Evolução</button>
    <button class="btn-primary" id="btnPrevisao">🔮 Previsão</button>
    <button class="btn-secondary" id="btnPDF">📄 PDF Clínico</button>
    <button class="btn-danger" id="btnLogout">⛔ Sair</button>

    <h2>📡 Retorno da API</h2>
    <div id="terminal" class="api-box">Aguardando...</div>

</div>

<script>
/* 🔐 BLOQUEIO */
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

/* 📌 Navegação */
document.getElementById("btnDashboardGeral").onclick = () => location.href = "analisar.html";
document.getElementById("btnEvolucao").onclick = () => location.href = "evolucao.html";
document.getElementById("btnPrevisao").onclick = () => location.href = "previsao.html";
document.getElementById("btnLogout").onclick = () => {
    localStorage.removeItem("revitarium_logged");
    location.href = "index.html";
};

/* 🚑 ENVIO PARA A API */
document.getElementById("enviarAnalise").onclick = async () => {
    const patient = document.getElementById("patientId").value.trim();
    const v = document.getElementById("vertebra").value.trim();
    const a = document.getElementById("angulo").value.trim();
    const terminal = document.getElementById("terminal");

    if(!patient || !v || !a){
        terminal.textContent = "⚠ Preencha todos os campos.";
        return;
    }

    terminal.textContent = "⏳ Enviando dados...";

    const res = await fetch(`https://revitarium.onrender.com/workflow/analyze/v4?patient_id=${patient}`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify([{vertebra:v, angle:Number(a)}])
    });

    const data = await res.json();
    terminal.textContent = JSON.stringify(data, null, 2);
};

/* 📄 PDF CLÍNICO */
document.getElementById("btnPDF").onclick = () => {
    const patient = prompt("ID do paciente:");
    if(patient) window.open(`https://revitarium.onrender.com/workflow/patient/${patient}/report/pdf`);
};
</script>

</body>
</html>
