<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revitarium – Dashboard (Mobile First)</title>
<style>
    :root {
        --bg: #0b0e11;
        --box: #14181d;
        --btn: #00c7ff;
        --text: #e8f8ff;
        --danger: #c72626;
    }
    body {
        background: var(--bg);
        color: var(--text);
        margin:0;
        font-family: Arial, sans-serif;
        padding:16px;
    }
    .container {
        max-width:540px;
        margin:auto;
        padding:10px;
        background:var(--box);
        border-radius:14px;
    }
    h1 {
        font-size:26px;
        font-weight:bold;
        margin-bottom:4px;
        text-align:center;
    }
    p { text-align:center; opacity:.7; font-size:14px; margin-top:0; }
    input, button {
        width:100%;
        padding:14px;
        margin:8px 0;
        border-radius:10px;
        border:none;
        font-size:16px;
    }
    input {
        background:#0f1318;
        color:white;
    }
    button {
        background:var(--btn);
        color:#00222e;
        font-weight:bold;
    }
    button:active { opacity:0.7; }

    /* BOTÕES EM GRID (MOBILE FIRST) */
    .grid {
        display:grid;
        grid-template-columns:1fr;
        gap:10px;
        margin-top:14px;
    }
    @media(min-width:450px){
        .grid { grid-template-columns:1fr 1fr; }
    }

    .logout {
        background: var(--danger);
        margin-top:14px;
    }

    #output {
        margin-top:16px;
        background:black;
        padding:16px;
        border-radius:10px;
        font-size:13px;
        min-height:100px;
        color:#9dffa4;
        white-space:pre-wrap;
        overflow-x:auto;
    }
</style>
</head>
<body>

<script>
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}
</script>

<div class="container">
    <h1>Revitarium</h1>
    <p>Dashboard Clínico • Mobile First</p>

    <input id="patientId" placeholder="ID do Paciente (ex: 123)">

    <div class="grid">
        <button onclick="novaAnalise()">Nova Análise</button>
        <button onclick="verDashboard()">Dashboard</button>
        <button onclick="verEvolucao()">Evolução</button>
        <button onclick="previsaoClinica()">Previsão</button>
        <button onclick="gerarPDF()">Gerar PDF</button>
    </div>

    <button class="logout" onclick="logout()">Sair</button>

    <div id="output">Aguardando...</div>
</div>

<script>
const API = "https://revitarium.onrender.com";

function getId(){
    const id = document.getElementById("patientId").value.trim();
    if(!id){ log("ERRO: informe um ID."); return null; }
    return id;
}
function log(x){ document.getElementById("output").innerText = JSON.stringify(x,null,2); }

function novaAnalise(){
    const id = getId(); if(!id) return;
    fetch(`${API}/workflow/analyze/v4?patient_id=${id}`,{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify([
            {"vertebra":"C5","angle":3},
            {"vertebra":"T8","angle":14},
            {"vertebra":"L4","angle":28}
        ])
    }).then(r=>r.json()).then(log);
}

function verDashboard(){
    const id = getId(); if(!id) return;
    fetch(`${API}/workflow/patient/${id}/dashboard`).then(r=>r.json()).then(log);
}

function verEvolucao(){
    const id = getId(); if(!id) return;
    fetch(`${API}/workflow/patient/${id}/evolution`).then(r=>r.json()).then(log);
}

function previsaoClinica(){
    const id = getId(); if(!id) return;
    fetch(`${API}/workflow/patient/${id}/predict`).then(r=>r.json()).then(log);
}

function gerarPDF(){
    const id = getId(); if(!id) return;
    window.open(`${API}/workflow/patient/${id}/report/pdf`,"_blank");
}

function logout(){
    localStorage.removeItem("revitarium_logged");
    window.location.href = "index.html";
}
</script>

</body>
</html>
