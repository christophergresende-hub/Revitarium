<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium – Dashboard</title>
<style>
    body {
        background:#0d0d0d;
        color:white;
        margin:0;
        font-family:Arial, sans-serif;
        padding:20px;
    }
    h1 { font-size:26px; margin-bottom:10px; }
    input, button {
        width:100%;
        padding:14px;
        margin:8px 0;
        border-radius:8px;
        border:none;
        font-size:16px;
    }
    input { background:#1e1e1e; color:white; }
    button { background:#007bff; color:white; font-weight:bold; }
    #output {
        margin-top:20px;
        background:black;
        padding:14px;
        border-radius:8px;
        font-size:14px;
        min-height:80px;
        color:#00ff00;
        overflow-x:auto;
    }
    .title {
        font-size:32px;
        font-weight:bold;
        margin-bottom:10px;
    }
</style>
</head>
<body>

<div class="title">Revitarium • Dashboard</div>
<p>Conectado. Pronto para executar ações.</p>

<hr>

<h3>ID do Paciente</h3>
<input id="patientId" placeholder="Ex: 123">

<button onclick="novaAnalise()">Nova Análise</button>
<button onclick="verDashboard()">Dashboard</button>
<button onclick="verEvolucao()">Evolução</button>
<button onclick="previsaoClinica()">Previsão Clínica</button>
<button onclick="gerarPDF()">Gerar PDF</button>

<div id="output">Aguardando...</div>

<script>
const API = "https://revitarium.onrender.com";

function getId() {
    const id = document.getElementById("patientId").value.trim();
    if(!id){ log("ERRO: informe um ID de paciente."); return null; }
    return id;
}

function log(msg){
    document.getElementById("output").innerText = msg;
}

function novaAnalise(){
    const id = getId(); if(!id) return;
    log("Enviando análise...");
    fetch(`${API}/workflow/analyze/v4?patient_id=${id}`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify([
            {"vertebra":"C5","angle":3},
            {"vertebra":"T8","angle":12},
            {"vertebra":"L4","angle":28}
        ])
    }).then(r=>r.json()).then(log);
}

function verDashboard(){
    const id = getId(); if(!id) return;
    log("Carregando dashboard...");
    fetch(`${API}/workflow/patient/${id}/dashboard`)
    .then(r=>r.json()).then(log);
}

function verEvolucao(){
    const id = getId(); if(!id) return;
    log("Buscando evolução...");
    fetch(`${API}/workflow/patient/${id}/evolution`)
    .then(r=>r.json()).then(log);
}

function previsaoClinica(){
    const id = getId(); if(!id) return;
    log("Calculando previsão...");
    fetch(`${API}/workflow/patient/${id}/predict`)
    .then(r=>r.json()).then(log);
}

function gerarPDF(){
    const id = getId(); if(!id) return;
    window.open(`${API}/workflow/patient/${id}/report/pdf`, "_blank");
}
</script>
</body>
</html>
