<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revitarium – Dashboard Clínico</title>

<style>
    body {
        margin: 0;
        background: #0d1117;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    /* HEADER */
    header {
        background: #004080;
        padding: 16px;
        text-align: center;
        font-size: 1.4rem;
        font-weight: bold;
    }

    /* BODY CONTENT */
    .container {
        flex: 1;
        padding: 18px;
        overflow-y: auto;
    }

    input, button {
        width: 100%;
        padding: 14px;
        margin: 6px 0;
        border-radius: 10px;
        border: none;
        font-size: 1rem;
    }

    input {
        background: #111418;
        color: #fff;
        border: 1px solid #30363d;
    }

    .btn {
        background: #0066ff;
        color: white;
        font-weight: bold;
    }

    .btn-danger {
        background: #b30000;
        color: white;
        font-weight: bold;
    }

    /* TERMINAL */
    .terminal {
        background: #000;
        color: #00ff00;
        padding: 16px;
        border-radius: 10px;
        min-height: 130px;
        font-family: monospace;
        white-space: pre-wrap;
        margin-top: 10px;
    }

    /* MOBILE NAVIGATION */
    nav {
        background: #0b1a2e;
        display: flex;
        justify-content: space-around;
        padding: 10px 0;
        border-top: 1px solid #1f2d40;
    }

    nav button {
        flex: 1;
        background: none;
        color: #9db4cf;
        font-size: 0.9rem;
        border: none;
        padding: 10px 0;
    }

    nav button.active {
        color: white;
        font-weight: bold;
        border-bottom: 2px solid #007bff;
    }
</style>
</head>
<body>

<header>Revitarium – Painel Clínico</header>

<div class="container">
    <h3>Inserir Nível Vertebral</h3>
    <input id="vertebra" placeholder="Ex: T7" />
    <input id="angulo" type="number" placeholder="Ângulo (ex: 12)" />
    <button class="btn" id="enviarAnalise">🚑 Enviar para Análise</button>

    <h3>Retorno da API</h3>
    <div id="terminal" class="terminal">Aguardando análise...</div>
</div>

<!-- NAV BAR MOBILE -->
<nav>
    <button id="btnDashboard" class="active">📊 Dashboard</button>
    <button id="btnEvolucao">📈 Evolução</button>
    <button id="btnPrevisao">🔮 Previsão</button>
    <button id="btnPDF">📄 PDF</button>
    <button id="btnLogout">⛔ Sair</button>
</nav>

<script>
/* ================ BLOQUEIO DE ACESSO ================ */
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

/* ================= NAVEGAÇÃO ================ */
document.getElementById("btnEvolucao").onclick = () => window.location.href = "evolucao.html";
document.getElementById("btnPrevisao").onclick = () => window.location.href = "previsao.html";
document.getElementById("btnDashboard").onclick = () => window.location.href = "dashboard.html";
document.getElementById("btnLogout").onclick = () => {
    localStorage.removeItem("revitarium_logged");
    window.location.href = "index.html";
};

/* ================= PDF ================ */
document.getElementById("btnPDF").onclick = async () => {
    const patientId = prompt("ID do paciente:");
    if(!patientId) return;
    window.open(`https://revitarium.onrender.com/workflow/patient/${patientId}/report/pdf`, "_blank");
};

/* ================= ENVIO PARA API ================ */
document.getElementById("enviarAnalise").onclick = async () => {
    const v = document.getElementById("vertebra").value.trim();
    const a = document.getElementById("angulo").value.trim();
    const term = document.getElementById("terminal");

    if(!v || !a){
        term.textContent = "Preencha vértebra e ângulo.";
        return;
    }

    try {
        term.textContent = "🔄 Enviando análise...";
        const res = await fetch("https://revitarium.onrender.com/workflow/analyze/v4?patient_id=123", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify([{ vertebra: v, angle: Number(a) }])
        });
        const data = await res.json();
        term.textContent = JSON.stringify(data, null, 2);
    } catch {
        term.textContent = "❌ Erro ao conectar com a API.";
    }
};
</script>

</body>
</html>
