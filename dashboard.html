<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReviTARIUM v14 • Dashboard Clínico</title>

<!-- Tipografia Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #6EC4B3;
    --dark: #151E26;
    --light: #FFFFFF;
    --frost: rgba(255,255,255,0.12);
}
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: var(--dark);
    color: var(--light);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* HEADER PREMIUM */
header {
    background: var(--primary);
    color: var(--light);
    text-align: center;
    padding: 22px 14px;
    font-size: 1.45rem;
    font-weight: 600;
    border-bottom: solid 3px var(--light);
}

/* CONTAINER */
.container {
    padding: 22px;
}

/* INPUTS */
input {
    width: 100%;
    padding: 16px;
    border-radius: 10px;
    border: none;
    background: var(--frost);
    backdrop-filter: blur(10px);
    font-size: 1rem;
    color: var(--light);
    margin-bottom: 14px;
}

/* BOTÕES PRINCIPAIS */
button.card {
    width: 100%;
    background: var(--primary);
    border: none;
    padding: 18px;
    border-radius: 14px;
    color: var(--light);
    font-size: 1rem;
    font-weight: 600;
    margin: 10px 0;
    text-align: left;
}

/* NAVEGAÇÃO INFERIOR (B) – FLUTUANTE */
.navbar {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 92%;
    background: var(--dark);
    border-radius: 18px;
    padding: 10px;
    display: flex;
    justify-content: space-around;
    border: 2px solid var(--primary);
}
.nav-btn {
    color: var(--light);
    font-weight: 500;
    font-size: 0.9rem;
}
</style>
</head>

<body>

<header>ReviTARIUM v14 • Dashboard Clínico</header>

<div class="container">

    <h3>ID do Paciente</h3>
    <input type="text" id="patientId" placeholder="Ex: 123">

    <h3>Inserir Nível Vertebral</h3>
    <input type="text" id="vertebra" placeholder="Ex: T7">
    <input type="number" id="angulo" placeholder="Ex: 12°">

    <button class="card" id="sendData">Enviar para Análise →</button>

    <h3 style="margin-top:30px;">Sessões Clínicas</h3>
    <button class="card" onclick="location.href='dashboard.html'">Dashboard Clínico →</button>
    <button class="card" onclick="location.href='evolucao.html'">Linha do Tempo Clínica →</button>
    <button class="card" onclick="location.href='previsao.html'">Previsão Clínica →</button>
</div>


<!-- NAVBAR B – conforme solicitado -->
<nav class="navbar">
    <div class="nav-btn" onclick="location.href='dashboard.html'">Home</div>
    <div class="nav-btn" onclick="location.href='evolucao.html'">Linha do Tempo</div>
    <div class="nav-btn" onclick="location.href='previsao.html'">Previsão Clínica</div>
</nav>

<script>
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

document.getElementById("sendData").onclick = async () => {
    const id = document.getElementById("patientId").value;
    const v = document.getElementById("vertebra").value;
    const a = document.getElementById("angulo").value;

    if(!id || !v || !a){
        alert("Preencha todos os campos.");
        return;
    }

    const body = [{ vertebra: v, angle: Number(a) }];
    fetch(`https://revitarium.onrender.com/workflow/analyze/v4?patient_id=${id}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
    }).then(r => r.json()).then(d => {
        console.log(d);
        alert("Análise enviada com sucesso!");
    }).catch(() => alert("Erro ao conectar à API."));
};
</script>

</body>
</html>
