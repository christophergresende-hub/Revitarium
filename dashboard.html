<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revitarium – Dashboard Clínico (v8)</title>

<style>
body {
    margin: 0;
    background: #0c0c0c;
    font-family: Arial, sans-serif;
    color: white;
}
header {
    background: #002a52;
    padding: 18px;
    text-align: center;
    font-size: 1.3rem;
    font-weight: bold;
}
.container {
    padding: 20px;
}
input, button {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    font-size: 1rem;
    border-radius: 8px;
    border: none;
}
input {
    background: #111;
    color: #fff;
}
.btn {
    background: #007bff;
    color: white;
    font-weight: bold;
}
.btn-danger {
    background: #8B0000;
    color: white;
    font-weight: bold;
}
.section-title {
    font-size: 1.4rem;
    margin-top: 30px;
    font-weight: bold;
}
.terminal {
    background: black;
    color: #00ff00;
    padding: 20px;
    border-radius: 10px;
    margin-top: 20px;
    min-height: 140px;
    font-family: monospace;
    white-space: pre-wrap;
}
.blocked {
    opacity: 0.3;
    pointer-events: none;
}
</style>
</head>
<body>

<header>Revitarium – Dashboard Clínico (v8)</header>

<div class="container">

    <!-- Identificação do Paciente -->
    <h2>ID do Paciente</h2>
    <input type="text" id="pacienteId" placeholder="Ex: 123" />

    <!-- Entrada de Dados Biomecânicos -->
    <h2>Inserir Nível Vertebral</h2>
    <input type="text" id="vertebra" placeholder="Ex: T7" />
    <input type="number" id="angulo" placeholder="Ex: 12 graus" />
    <button class="btn" id="enviarAnalise">🚑 Enviar para Análise</button>

    <!-- Navegação -->
    <h2 class="section-title">Consultas Rápidas</h2>
    <button class="btn" id="btnDashboard">📊 Dashboard Geral</button>
    <button class="btn" id="btnEvolucao">📈 Evolução</button>
    <button class="btn" id="btnPrevisao">🔮 Previsão</button>

    <button class="btn" id="btnPDF">📄 Gerar PDF Clínico</button>
    <button class="btn-danger" id="btnLogout">⛔ Sair</button>

    <!-- Terminal de Resposta -->
    <h2 class="section-title">Retorno da API</h2>
    <div id="terminal" class="terminal">Aguardando...</div>

</div>

<script>
/* =======================================================
   CONTROLE DE ACESSO
==========================================================*/
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

const role = localStorage.getItem("revitarium_role");

/* Paciente com acesso restrito */
if(role === "paciente"){
    document.getElementById("btnDashboard").innerText = "Meus dados";
    document.getElementById("btnPDF").classList.add("blocked");
}

/* =======================================================
   NAVEGAÇÃO
==========================================================*/
document.getElementById("btnDashboard").onclick = () => {
    window.location.href = "dashboard.html";
};
document.getElementById("btnEvolucao").onclick = () => {
    window.location.href = "evolucao.html";
};
document.getElementById("btnPrevisao").onclick = () => {
    window.location.href = "previsao.html";
};

/* =======================================================
   PDF CLÍNICO (CLÍNICO SOMENTE)
==========================================================*/
document.getElementById("btnPDF").onclick = async () => {
    const patientId = prompt("Digite o ID do paciente para gerar PDF:");
    if(!patientId) return;
    window.open(`https://revitarium.onrender.com/workflow/patient/${patientId}/report/pdf`, "_blank");
};

/* =======================================================
   LOGOUT
==========================================================*/
document.getElementById("btnLogout").onclick = () => {
    localStorage.clear();
    window.location.href = "index.html";
};

/* =======================================================
   ENVIO DE ANÁLISE BIOMECÂNICA PARA API
==========================================================*/
document.getElementById("enviarAnalise").onclick = async () => {
    const id = document.getElementById("pacienteId").value.trim();
    const vertebra = document.getElementById("vertebra").value.trim();
    const angulo = document.getElementById("angulo").value.trim();
    const terminal = document.getElementById("terminal");

    if(!id || !vertebra || !angulo){
        terminal.textContent = "⚠️ Informe ID, vértebra e ângulo.";
        return;
    }

    terminal.textContent = "🔄 Enviando...";

    try {
        const body = [{ vertebra: vertebra, angle: Number(angulo) }];
        const res = await fetch(`https://revitarium.onrender.com/workflow/analyze/v4?patient_id=${id}`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        });

        terminal.textContent = JSON.stringify(await res.json(), null, 2);
    }
    catch(err){
        terminal.textContent = "❌ Erro: API não respondeu.";
    }
};
</script>

</body>
</html>
