<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revitarium – Análise Clínica PRO</title>
<style>
    body {
        margin: 0;
        background: #0c0c0c;
        font-family: Arial, sans-serif;
        color: white;
    }
    header {
        background: #002a52;
        padding: 18px;
        text-align: center;
        font-size: 1.3rem;
        font-weight: bold;
    }
    .container {
        padding: 20px;
    }
    input, button {
        width: 100%;
        padding: 15px;
        margin: 8px 0;
        font-size: 1rem;
        border-radius: 8px;
        border: none;
    }
    input {
        background: #111;
        color: #fff;
    }
    .btn{
        background: #007bff;
        color: white;
        font-weight: bold;
    }
    .btn-danger{
        background: #8B0000;
        color: white;
        font-weight: bold;
    }
    .section-title{
        font-size: 1.4rem;
        margin-top: 30px;
        font-weight: bold;
    }
    .terminal {
        background: black;
        color: #00ff00;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
        min-height: 140px;
        font-family: monospace;
        white-space: pre-wrap;
    }
</style>
</head>
<body>

<header>Revitarium – Análise Clínica PRO</header>

<div class="container">

    <h2>Inserir vértebras</h2>
    <input type="text" id="vertebra" placeholder="T7" />
    <input type="number" id="angulo" placeholder="12" />
    <button class="btn" id="addNivel">+ Adicionar nível</button>
    <button class="btn" id="enviarAnalise">🚑 Enviar para Análise</button>

    <h2 class="section-title">Consultas Rápidas</h2>
    <button class="btn" id="btnDashboard">📊 Dashboard</button>
    <button class="btn" id="btnEvolucao">📈 Evolução</button>
    <button class="btn" id="btnPrevisao">🔮 Previsão</button>
    <button class="btn" id="btnPDF">📄 PDF (em breve)</button>
    <button class="btn-danger" id="btnLogout">⛔ Sair</button>

    <h2 class="section-title">Retorno da API</h2>
    <div id="terminal" class="terminal">Aguardando...</div>

</div>

<script>
/* ============================
   BLOQUEIO DE ACESSO SEM LOGIN
===============================*/
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

/* ============================
        NAVEGAÇÃO
===============================*/
document.getElementById("btnDashboard").onclick = () => {
    window.location.href = "dashboard.html";
};

document.getElementById("btnEvolucao").onclick = () => {
    window.location.href = "evolucao.html";
};

document.getElementById("btnPrevisao").onclick = () => {
    window.location.href = "previsao.html";
};

document.getElementById("btnPDF").onclick = () => {
    alert("Módulo PDF em construção");
};

document.getElementById("btnLogout").onclick = () => {
    localStorage.removeItem("revitarium_logged");
    window.location.href = "index.html";
};


/* ============================
     ENVIO DE ANÁLISE PARA API
===============================*/
document.getElementById("enviarAnalise").onclick = async () => {
    const vertebra = document.getElementById("vertebra").value.trim();
    const angulo = document.getElementById("angulo").value.trim();
    const terminal = document.getElementById("terminal");

    if(!vertebra || !angulo){
        terminal.textContent = "Erro: preencha vértebra e ângulo.";
        return;
    }

    try {
        const body = [{ vertebra: vertebra, angle: Number(angulo) }];
        terminal.textContent = "Enviando...";

        const res = await fetch("https://revitarium.onrender.com/workflow/analyze/v4?patient_id=123", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        });

        const data = await res.json();
        terminal.textContent = JSON.stringify(data, null, 2);

    } catch (err) {
        terminal.textContent = "Erro de conexão com a API.";
    }
};
</script>

</body>
</html>
