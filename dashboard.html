<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium • Dashboard</title>
<style>
body {margin:0; background:#000; font-family:Arial, sans-serif; color:white;}
header {padding:20px; text-align:center; background:#111; font-size:24px; font-weight:bold;}

.container {padding:20px; width:95%; margin:auto;}
input {width:100%; padding:14px; margin:10px 0; border-radius:8px; border:none; font-size:16px;}
button {
    width:100%; padding:14px; background:#006CFF; color:white; border:none;
    font-size:18px; border-radius:8px; cursor:pointer; margin:8px 0; font-weight:bold;
}
button:hover {background:#0051c1;}
.logout {background:#ff3333;}
#output {
    background:black; padding:10px; color:#00ff00; margin-top:20px; min-height:80px;
    border-radius:8px; font-family:monospace;
}
</style>
</head>
<body>

<script>
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}
</script>

<header>Revitarium • Dashboard</header>

<div class="container">
    <input id="patientId" type="text" placeholder="ID do Paciente (ex: 123)">

    <button onclick="novaAnalise()">Nova Análise</button>
    <button onclick="verDashboard()">Dashboard</button>
    <button onclick="evolucao()">Evolução</button>
    <button onclick="prevClinica()">Previsão Clínica</button>
    <button onclick="pdfClinico()">Gerar PDF</button>

    <button class="logout" onclick="logout()">Sair</button>

    <div id="output">Aguardando...</div>
</div>

<script>
const API = "https://revitarium.onrender.com";

function print(msg){ document.getElementById("output").textContent = msg; }

function novaAnalise(){ print("Nova análise enviada... (futura automação)") }
function verDashboard(){ print("Dashboard carregando...") }
function evolucao(){ print("Carregando evolução longitudinal...") }
function prevClinica(){ print("Gerando previsão clínica...") }
function pdfClinico(){ print("Gerando PDF clínico (em breve)...") }

function logout(){
    localStorage.removeItem("revitarium_logged");
    window.location.href="index.html";
}
</script>

</body>
</html>
