<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium Dashboard PRO</title>

<style>
    :root{
        --primary:#002244;
        --primary-dark:#00172f;
        --accent:#00c8ff;
        --danger:#8B0000;
        --bg:#f2f6fa;
    }
    body{
        background:var(--bg);
        font-family:Arial, sans-serif;
        margin:0;
        padding:0;
    }
    header{
        background:var(--primary);
        color:white;
        padding:15px;
        font-size:20px;
        font-weight:bold;
        text-align:center;
        position:sticky;
        top:0;
    }
    .container{
        padding:20px;
        max-width:480px;
        margin:auto;
    }
    input{
        width:100%;
        padding:12px;
        border-radius:10px;
        border:1px solid #ccc;
        margin-bottom:15px;
        font-size:16px;
    }
    .card{
        background:white;
        padding:15px;
        border-radius:12px;
        margin-bottom:15px;
        box-shadow:0 2px 6px rgba(0,0,0,0.08);
    }
    button{
        width:100%;
        padding:14px;
        border:none;
        border-radius:10px;
        font-size:16px;
        font-weight:bold;
        margin-top:8px;
        cursor:pointer;
        background:var(--primary);
        color:white;
    }
    button:hover{ background:var(--primary-dark); }
    .logout{ background:var(--danger)!important; }
    pre{
        background:black;
        color:#0f0;
        padding:15px;
        border-radius:12px;
        overflow:auto;
        min-height:180px;
        font-size:14px;
        margin-top:10px;
    }
</style>
</head>

<body>

<header>Revitarium – Painel Clínico PRO</header>

<!-- BLOQUEIO DE ACESSO SEM LOGIN -->
<script>
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}
</script>

<div class="container">

    <div class="card">
        <h3>Paciente</h3>
        <input id="patientId" placeholder="Ex: 123">
    </div>

    <div class="card">
        <h3>Consultas rápidas</h3>
        <button onclick="verDashboard()">📊 Dashboard</button>
        <button onclick="evolucao()">📈 Evolução</button>
        <button onclick="prevClinica()">🔮 Previsão</button>
        <button onclick="pdfClinico()">📄 PDF (em breve)</button>
    </div>

    <div class="card">
        <h3>Ações</h3>
        <button class="logout" onclick="logout()">⛔ Sair</button>
    </div>

    <div class="card">
        <h3>Retorno da API</h3>
        <pre id="output">Aguardando requisição...</pre>
    </div>
</div>

<script>
const API = "https://revitarium.onrender.com";

function print(data){
    document.getElementById("output").textContent = JSON.stringify(data,null,2);
}

function getID(){
    let id = document.getElementById("patientId").value.trim();
    if(!id){ print("Erro: informe o ID do paciente"); return null; }
    return id;
}

async function verDashboard(){
    let id=getID(); if(!id)return;
    let r=await fetch(`${API}/workflow/patient/${id}/dashboard`);
    print(await r.json());
}

async function evolucao(){
    let id=getID(); if(!id)return;
    let r=await fetch(`${API}/workflow/patient/${id}/evolution`);
    print(await r.json());
}

async function prevClinica(){
    let id=getID(); if(!id)return;
    let r=await fetch(`${API}/workflow/patient/${id}/predict`);
    print(await r.json());
}

function pdfClinico(){
    print("PDF disponível na versão 5.x");
}

function logout(){
    localStorage.removeItem("revitarium_logged");
    window.location.href="index.html";
}
</script>

</body>
</html>
