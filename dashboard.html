<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium – Dashboard v7</title>
<style>
body{margin:0;background:#0d0d0d;color:white;font-family:Arial}
header{background:#002a52;padding:20px;text-align:center;font-size:1.4rem;font-weight:bold}
.container{padding:20px}
input,button{width:100%;padding:14px;margin:8px 0;border:none;border-radius:8px;font-size:1rem}
input{background:#111;color:white}
.btn{background:#007bff;color:white;font-weight:bold}
.btn-danger{background:#8B0000;color:white;font-weight:bold}
.terminal{background:black;color:#00ff00;min-height:140px;padding:20px;border-radius:10px;margin-top:20px;white-space:pre-wrap;font-family:monospace}
</style>
</head>
<body>

<header>Revitarium – Dashboard Clínico</header>
<div class="container">

<h2>ID do Paciente</h2>
<input type="text" id="pacienteId" placeholder="Ex: 123" />

<h2>Inserir nível vertebral</h2>
<input type="text" id="vertebra" placeholder="Ex: T7">
<input type="number" id="angulo" placeholder="Ex: 12">
<button class="btn" id="enviarAnalise">🚑 Enviar para análise</button>

<h2>Consultas Rápidas</h2>
<button class="btn" id="btnEvolucao">📈 Evolução</button>
<button class="btn" id="btnPrevisao">🔮 Previsão</button>
<button class="btn" id="btnPDF">📄 Gerar PDF Clínico</button>
<button class="btn-danger" id="btnLogout">⛔ Sair</button>

<h2>Retorno da API</h2>
<div id="terminal" class="terminal">Aguardando...</div>

</div>

<script>
// Bloqueio de acesso sem login
if(localStorage.getItem("revitarium_logged") !== "yes"){
   window.location.href = "index.html";
}

// ENVIO PARA A API (v7 MULTI PACIENTE)
document.getElementById("enviarAnalise").onclick = async () => {
    const id = document.getElementById("pacienteId").value.trim();
    const v = document.getElementById("vertebra").value.trim();
    const a = document.getElementById("angulo").value.trim();
    const terminal = document.getElementById("terminal");

    if(!id) return terminal.textContent = "⚠ Informe um ID de paciente.";
    if(!v || !a) return terminal.textContent = "⚠ Preencha vértebra e ângulo.";

    terminal.textContent = "Enviando...";

    const req = await fetch(`https://revitarium.onrender.com/workflow/analyze/v4?patient_id=${id}`,{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify([{ vertebra:v, angle:Number(a) }])
    });
    const data = await req.json();
    terminal.textContent = JSON.stringify(data,null,2);
};

// Navegação
document.getElementById("btnEvolucao").onclick=()=>{window.location.href="evolucao.html";}
document.getElementById("btnPrevisao").onclick=()=>{window.location.href="previsao.html";}
document.getElementById("btnLogout").onclick=()=>{localStorage.removeItem("revitarium_logged");window.location.href="index.html";}

// PDF
document.getElementById("btnPDF").onclick = () => {
   const id = prompt("ID do paciente?");
   if(id) window.open(`https://revitarium.onrender.com/workflow/patient/${id}/report/pdf`,"_blank")
};
</script>

</body>
</html>
