<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revitarium • Dashboard</title>
<style>
body {
    background:#000; color:white;
    font-family:Arial, sans-serif;
    margin:0; padding:20px;
}
input{
    width:100%; padding:14px;
    margin:10px 0; border-radius:8px;
    border:none; background:#222; color:white;
    font-size:16px;
}
button{
    width:100%; padding:14px;
    border:none; background:#007BFF; color:white;
    border-radius:8px; font-size:18px;
    margin:6px 0;
}
.logout{
    background:#ff4444;
}
</style>
</head>
<body>

<script>
// 🔒 Proteção - impede acesso sem login
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}
</script>

<h2>Revitarium • Dashboard</h2>
<p>Conectado com sucesso.</p>

<input id="patient_id" placeholder="ID do Paciente (Ex: 123)" />

<button onclick="novaAnalise()">Nova Análise</button>
<button onclick="verDashboard()">Dashboard</button>
<button onclick="evolucao()">Evolução</button>
<button onclick="previsao()">Previsão Clínica</button>
<button onclick="pdf()">Gerar PDF</button>

<button class="logout" onclick="logout()">Sair do Sistema</button>

<pre id="resposta" style="background:#111; padding:12px; margin-top:20px;">Aguardando...</pre>

<script>
const API = "https://revitarium.onrender.com";

// BOTÕES
function novaAnalise(){ executar(`/workflow/analyze/v4?patient_id=${id()}`, "POST", exemplo()); }
function verDashboard(){ executar(`/workflow/patient/${id()}/dashboard`); }
function evolucao(){ executar(`/workflow/patient/${id()}/evolution`); }
function previsao(){ executar(`/workflow/patient/${id()}/predict`); }
function pdf(){ window.open(`${API}/workflow/patient/${id()}/report/pdf`); }

// FUNÇÕES
function id(){ return document.getElementById("patient_id").value.trim(); }
function exemplo(){
return JSON.stringify([
 { "vertebra":"C5", "angle":3 },
 { "vertebra":"T8", "angle":12 },
 { "vertebra":"L4", "angle":28 }
 ]);
}
async function executar(endpoint, method="GET", body=null){
    try{
        const resposta = await fetch(API + endpoint, {
            method,
            headers:{ "Content-Type":"application/json" },
            body
        });
        document.getElementById("resposta").innerText = JSON.stringify(await resposta.json(), null, 2);
    }catch(e){
        document.getElementById("resposta").innerText = "ERRO: " + e;
    }
}
function logout(){
    localStorage.removeItem("revitarium_logged");
    window.location.href="index.html";
}
</script>

</body>
</html>
