<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium Dashboard</title>
<style>
    body{
        margin:0;
        font-family: Arial, sans-serif;
        background:#f4f4f4;
        color:#222;
    }
    header{
        background:#002244;
        color:white;
        padding:15px;
        text-align:center;
        font-size:20px;
        font-weight:bold;
    }
    .container{
        padding:20px;
        display:flex;
        flex-direction:column;
        gap:15px;
        max-width:500px;
        margin:auto;
    }
    input{
        width:100%;
        padding:12px;
        border-radius:8px;
        border:1px solid #ccc;
        font-size:16px;
    }
    button{
        width:100%;
        padding:14px;
        background:#002244;
        color:white;
        border:none;
        border-radius:10px;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
    }
    button:hover{ background:#003366; }
    pre{
        background:black;
        color:#0f0;
        padding:15px;
        border-radius:10px;
        min-height:150px;
        overflow:auto;
        font-size:14px;
    }
    footer{
        text-align:center;
        font-size:12px;
        padding:10px;
        margin-top:20px;
        color:#555;
    }
</style>
</head>

<body>

<header>Revitarium - Painel Clínico</header>

<!-- BLOQUEIO DE ACESSO SEM LOGIN -->
<script>
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}
</script>

<div class="container">

    <h3>ID do Paciente:</h3>
    <input type="text" id="patientId" placeholder="Ex: 123">

    <button onclick="novaAnalise()">Nova análise biomecânica</button>
    <button onclick="verDashboard()">📊 Ver Dashboard</button>
    <button onclick="evolucao()">📈 Evolução Longitudinal</button>
    <button onclick="prevClinica()">🔮 Previsão Clínica</button>
    <button onclick="pdfClinico()">📄 PDF Clínico</button>
    <button style="background:#8B0000;" onclick="logout()">⛔ Sair</button>

    <pre id="output">Aguardando ação...</pre>
</div>

<footer>Revitarium API • Mobile First • v1 Dashboard</footer>

<script>
const API = "https://revitarium.onrender.com";

function print(data){
    document.getElementById("output").textContent = JSON.stringify(data,null,2);
}

function getID(){
    let id = document.getElementById("patientId").value.trim();
    if(!id){ print("ERRO: Digite um ID, ex: 123"); return null; }
    return id;
}

// ====== AÇÕES ======

function novaAnalise(){
    print("Função de análise em construção. Próximo passo do projeto.");
}

async function verDashboard(){
    let id = getID(); if(!id) return;
    let res = await fetch(`${API}/workflow/patient/${id}/dashboard`);
    print(await res.json());
}

async function evolucao(){
    let id = getID(); if(!id) return;
    let res = await fetch(`${API}/workflow/patient/${id}/evolution`);
    print(await res.json());
}

async function prevClinica(){
    let id = getID(); if(!id) return;
    let res = await fetch(`${API}/workflow/patient/${id}/predict`);
    print(await res.json());
}

function pdfClinico(){
    print("PDF será habilitado ao final do módulo v5.");
}

function logout(){
    localStorage.removeItem("revitarium_logged");
    window.location.href = "index.html";
}
</script>

</body>
</html>
