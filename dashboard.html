<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revitarium • Dashboard (v13)</title>

<style>
    body{
        margin:0;
        background:#050505;
        font-family:-apple-system, BlinkMacSystemFont, Arial;
        color:white;
    }

    /* TopBar estilo iOS */
    header{
        background:#002A52;
        color:white;
        text-align:center;
        padding:18px;
        font-size:1.3rem;
        font-weight:600;
        position:sticky;
        top:0;
        z-index:10;
    }

    .container{
        padding:20px;
        max-width:420px;
        margin:auto;
    }

    .card{
        background:#111;
        padding:20px;
        margin:18px 0;
        border-radius:16px;
        box-shadow:0 0 12px rgba(0,0,0,.4);
    }

    input,button{
        width:100%;
        padding:15px;
        font-size:1rem;
        border:none;
        border-radius:12px;
        margin:8px 0;
    }

    input{
        background:#222;
        color:white;
    }

    .btn{
        background:#0A84FF;
        color:white;
        font-weight:bold;
        box-shadow:0 6px 15px rgba(10,132,255,.4);
    }

    .btn-secundario{
        background:#0F3B63;
        color:white;
        font-weight:bold;
    }

    .btn-danger{
        background:#8B0000;
        color:white;
        font-weight:bold;
    }

    .terminal{
        background:black;
        padding:20px;
        border-radius:12px;
        font-family:monospace;
        color:#00ff00;
        min-height:120px;
        white-space:pre-wrap;
        font-size:.9rem;
        margin-top:5px;
    }

    /* Bottom Navigation */
    nav{
        position:fixed;
        bottom:0;
        left:0;
        width:100%;
        background:#0B0B0B;
        border-top:1px solid #222;
        display:flex;
        justify-content:space-around;
        padding:10px 0;
    }
    nav button{
        flex:1;
        margin:0 4px;
        font-size:.85rem;
        padding:12px;
        border-radius:10px;
    }
</style>
</head>
<body>

<header>Revitarium • Dashboard Clínico (v13)</header>

<div class="container">

    <!-- ID do Paciente -->
    <div class="card">
        <h2>ID do Paciente</h2>
        <input id="patientId" type="text" placeholder="Ex: 123">
    </div>

    <!-- Inserir vértebra -->
    <div class="card">
        <h2>Inserir Nível Vertebral</h2>
        <input id="vertebra" type="text" placeholder="Ex: T7">
        <input id="angulo" type="number" placeholder="Ex: 12 graus">
        <button class="btn" id="enviarAnalise">🚑 Enviar para Análise</button>
    </div>

    <!-- Consultas Rápidas -->
    <div class="card">
        <h2>Consultas Rápidas</h2>
        <button class="btn-secundario" id="goDashboard">📊 Dashboard Geral</button>
        <button class="btn-secundario" id="goEvolucao">📈 Evolução</button>
        <button class="btn-secundario" id="goPrevisao">🔮 Previsão</button>
        <button class="btn-secundario" id="goPDF">📄 PDF Clínico</button>
        <button class="btn-danger" id="logout">⛔ Sair</button>
    </div>

    <div class="card">
        <h2>Retorno da API</h2>
        <div class="terminal" id="terminal">Aguardando...</div>
    </div>

</div>

<!-- Bottom Navigation -->
<nav>
    <button onclick="window.location.href='dashboard.html'">🏠 Início</button>
    <button onclick="window.location.href='evolucao.html'">📈 Evolução</button>
    <button onclick="window.location.href='previsao.html'">🔮 Previsão</button>
</nav>

<script>
/* 🔒 Controle de Acesso */
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

/* 🧭 Navegação */
document.getElementById("goDashboard").onclick = () => location.href="dashboard.html";
document.getElementById("goEvolucao").onclick = () => location.href="evolucao.html";
document.getElementById("goPrevisao").onclick = () => location.href="previsao.html";
document.getElementById("goPDF").onclick = () => {
    const id = prompt("ID do paciente para gerar PDF:");
    if(id) window.open(`https://revitarium.onrender.com/workflow/patient/${id}/report/pdf`, "_blank");
};

document.getElementById("logout").onclick = () => {
    localStorage.removeItem("revitarium_logged");
    window.location.href = "index.html";
};

/* 🚑 Enviar análise */
document.getElementById("enviarAnalise").onclick = async () => {
    const id = document.getElementById("patientId").value.trim();
    const v = document.getElementById("vertebra").value.trim();
    const a = document.getElementById("angulo").value.trim();
    const t = document.getElementById("terminal");

    if(!id || !v || !a){ t.textContent="Preencha todos os campos."; return; }

    t.textContent="Enviando...";

    try{
        const res = await fetch(
            `https://revitarium.onrender.com/workflow/analyze/v4?patient_id=${id}`,
            {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify([{vertebra:v,angle:Number(a)}])
            }
        );
        t.textContent = JSON.stringify(await res.json(),null,2);
    }catch(e){ t.textContent="Erro ao conectar com a API."; }
};
</script>

</body>
</html>
