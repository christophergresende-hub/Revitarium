<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Revitarium • Dashboard Clínico</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f9ff;
        color: #003b63;
    }
    header {
        background: #0068a8;
        padding: 20px;
        text-align: center;
        font-size: 1.4rem;
        font-weight: bold;
        color: white;
    }
    .container {
        padding: 20px;
    }
    h2 {
        font-size: 1.3rem;
        margin-bottom: 10px;
        font-weight: bold;
    }
    input, button {
        width: 100%;
        padding: 15px;
        margin: 8px 0;
        border-radius: 10px;
        font-size: 1rem;
        border: none;
        outline: none;
    }
    input {
        background: #ffffff;
        border: 2px solid #d6e9f7;
    }
    .btn-primary {
        background: #0076c5;
        color: white;
        font-weight: bold;
    }
    .card {
        background: white;
        padding: 16px;
        border-radius: 12px;
        margin-top: 18px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .terminal {
        background: #e9f5ff;
        border-left: 4px solid #0076c5;
        padding: 15px;
        margin-top: 10px;
        border-radius: 8px;
        font-family: monospace;
        color: #005388;
    }

    /* MENU INFERIOR TIPO APP */
    .nav-bottom {
        position: fixed;
        bottom: 0;
        left: 0; right: 0;
        background: #003b63;
        display: flex;
        justify-content: space-around;
        padding: 12px 0;
    }
    .nav-bottom button {
        background: none;
        border: none;
        color: white;
        font-weight: bold;
        font-size: 1rem;
    }
</style>
</head>

<body>

<header>Hospital Premium • Dashboard Clínico</header>

<div class="container">

    <h2>ID do Paciente</h2>
    <input id="patientId" placeholder="Ex: 123"/>

    <h2>Inserir Nível Vertebral</h2>
    <input id="vertebra" placeholder="Ex: T7"/>
    <input id="angulo" placeholder="Ex: 12 graus"/>
    <button class="btn-primary" id="enviarAnalise">🚑 Enviar para Análise</button>

    <div class="card">
        <h3>Retorno da API</h3>
        <div id="terminal" class="terminal">Aguardando...</div>
    </div>

</div>

<!-- NAVEGAÇÃO INFERIOR -->
<div class="nav-bottom">
    <button onclick="window.location.href='dashboard.html'">🏥 Dashboard</button>
    <button onclick="window.location.href='evolucao.html'">📈 Evolução</button>
    <button onclick="window.location.href='previsao.html'">🔍 Previsão</button>
</div>

<script>
/* Proteção de acesso */
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

/* Envio de análise */
document.getElementById("enviarAnalise").onclick = async () => {
    const id = document.getElementById("patientId").value.trim();
    const vertebra = document.getElementById("vertebra").value.trim();
    const angulo = document.getElementById("angulo").value.trim();
    const terminal = document.getElementById("terminal");

    if(!id || !vertebra || !angulo){
        terminal.textContent = "Preencha todos os campos antes de enviar.";
        return;
    }

    terminal.textContent = "Enviando...";

    try {
        const body = [{ vertebra: vertebra, angle: Number(angulo) }];
        const res = await fetch(`https://revitarium.onrender.com/workflow/analyze/v4?patient_id=${id}`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        });
        const data = await res.json();
        terminal.textContent = JSON.stringify(data, null, 2);
    } catch(e) {
        terminal.textContent = "Erro: API indisponível no momento.";
    }
};
</script>

</body>
</html>
