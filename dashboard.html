<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium • Dashboard Clínico v15</title>

<style>
:root {
    --verde-base:#6EC4B3;    /* Fundo principal inspirada na arte */
    --verde-escuro:#151e26;  /* Faixa lateral igual ao projeto */
    --branco:#FFFFFF;
    --texto:#EAF7F5;
}

body {
    margin:0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: var(--branco);
    color: var(--texto);
}

/* ======== SOBREPOSIÇÃO DO LAYOUT ======== */
.bg-wrapper{
    display:flex;
    height: 250px;
    width:100%;
    background: var(--verde-base);
    position:relative;
    overflow:hidden;
}

/* FAIXA ESQUERDA ESCURA IGUAL AO PROJETO */
.bg-wrapper:before{
    content:"";
    position:absolute;
    left:0; top:0;
    width:17%;
    height:100%;
    background: var(--verde-escuro);
}

/* TEXTO SOBREPOSTO IGUAL NO EXEMPLO */
.overlay-title{
    position:absolute;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%);
    text-align:center;
    font-size:1.35rem;
    font-weight:bold;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:white;
}

/* ======== CONTEÚDO ======== */
.container{
    padding:20px;
    max-width:550px;
    margin:auto;
}

h2{
    color:var(--verde-escuro);
    margin-top:25px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #BDE4D9;
    background:white;
    font-size:1rem;
    color:#1A2A32;
}

button{
    width:100%;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    font-size:1rem;
    font-weight:bold;
    border:none;
}

.btn-solid{
    background:var(--verde-base);
    color:#002926;
}

.btn-outline{
    background:white;
    border:2px solid var(--verde-base);
    color:var(--verde-escuro);
}

.btn-danger{
    background:#B04141;
    color:white;
}

/* TERMINAL */
.terminal{
    background:#F5FFFD;
    border-left:6px solid var(--verde-base);
    padding:15px;
    border-radius:10px;
    color:#00322F;
    min-height:110px;
    white-space:pre-wrap;
    font-family:monospace;
}

/* MENU INFERIOR */
.menu-bottom{
    position:fixed;
    bottom:0; left:0;
    width:100%;
    background:var(--verde-escuro);
    padding:12px 0;
    display:flex;
    justify-content:space-around;
}

.menu-bottom button{
    background:none;
    border:none;
    color:white;
    font-size:1rem;
}
</style>
</head>
<body>

<!-- TOPO COM SOBREPOSIÇÃO -->
<div class="bg-wrapper">
    <div class="overlay-title">REVISÃO CLÍNICA</div>
</div>

<div class="container">

    <h2>ID do Paciente</h2>
    <input id="pacienteId" placeholder="Ex: 123">

    <h2>Nível Vertebral</h2>
    <input id="vertebra" placeholder="Ex: T7">
    <input id="angulo" type="number" placeholder="Ex: 12 graus">

    <button class="btn-solid" id="enviarAnalise">🚑 Enviar para Análise</button>

    <h2>Consultas Rápidas</h2>
    <button class="btn-outline" onclick="nav('dashboard.html')">📊 Dashboard</button>
    <button class="btn-outline" onclick="nav('evolucao.html')">📈 Evolução</button>
    <button class="btn-outline" onclick="nav('previsao.html')">🔮 Previsão</button>
    <button class="btn-outline" onclick="nav('pdf.html')">📄 PDF Clínico</button>
    <button class="btn-danger" onclick="logout()">⛔ Sair</button>

    <h2>Retorno da API</h2>
    <pre id="terminal" class="terminal">Aguardando consulta...</pre>
</div>

<div class="menu-bottom">
    <button onclick="nav('dashboard.html')">🏠 Início</button>
    <button onclick="nav('evolucao.html')">📈 Evolução</button>
    <button onclick="nav('previsao.html')">🔮 Previsão</button>
</div>

<script>
if(localStorage.getItem("revitarium_logged") !== "yes"){
    window.location.href = "index.html";
}

function nav(p){ window.location.href = p }
function logout(){ localStorage.removeItem("revitarium_logged"); window.location.href="index.html"; }

document.getElementById("enviarAnalise").onclick = async () => {
    const id = pacienteId.value.trim();
    const v  = vertebra.value.trim();
    const a  = angulo.value.trim();
    const out = document.getElementById("terminal");

    if(!id || !v || !a){
        out.textContent = "Preencha ID, vértebra e ângulo.";
        return;
    }

    out.textContent = "Consultando API…";

    try{
        const r = await fetch(`https://revitarium.onrender.com/workflow/analyze/v4?patient_id=${id}`,{
            method:"POST",
            headers:{ "Content-Type":"application/json"},
            body:JSON.stringify([{vertebra:v, angle:Number(a)}])
        });
        const json = await r.json();
        out.textContent = JSON.stringify(json,null,2);
    }catch{
        out.textContent = "Erro de conexão.";
    }
}
</script>

</body>
</html>
