<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revitarium Dashboard • B</title>
<style>
body{margin:0;background:#f8f8f8;color:#222;font-family:sans-serif;padding:20px;}
h1{font-size:26px;font-weight:bold;margin-bottom:8px;color:#111;}
.card{background:white;padding:20px;border-radius:16px;margin-bottom:20px;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
input,button{width:100%;padding:14px;border-radius:8px;border:none;font-size:16px;margin-bottom:12px;}
input{background:#eee;}
button{background:#007bff;color:white;font-weight:bold;}
#out{background:#111;padding:16px;color:#00ff00;border-radius:8px;font-size:14px;min-height:80px;}
</style>
<script>
const API="https://revitarium.onrender.com";
async function call(endpoint){
 const id=document.getElementById("pid").value;
 const r=await fetch(`${API}${endpoint}${id}`);document.getElementById("out").innerText=await r.text();
}
</script>
</head>
<body>
<h1>Revitarium • Dashboard B</h1>
<div class="card">
<input id="pid" placeholder="ID do Paciente (ex: 123)">
<button onclick='call("/workflow/patient/")'>Ver Dashboard</button>
<button onclick='call("/workflow/patient/")'>Evolução Longitudinal</button>
<button onclick='call("/workflow/patient/")'>Previsão Clínica</button>
<button onclick='call("/workflow/patient/")'>Gerar PDF</button>
</div>
<div id="out">Aguardando...</div>
</body>
</html>
